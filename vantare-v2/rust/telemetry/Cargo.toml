[package]
name = "vantare-telemetry"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "vantare_telemetry"
path = "src/lib.rs"

[[bin]]
name = "vantare-telemetry"
path = "src/main.rs"

[[bin]]
name = "vantare-telemetry-replay"
path = "src/bin/replay.rs"
required-features = ["replay-harness"]

[features]
replay-harness = []

[[bench]]
name = "parse_lmu"
harness = false

[[bench]]
name = "engineer_44"
harness = false

[[bench]]
name = "assembly_44"
harness = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
ureq = { version = "3.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
