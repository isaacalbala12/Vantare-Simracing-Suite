[package]
name = "vantare-overlays-rune"
version = "0.0.0"
edition = "2024"

[features]
medir-latencia = ["vantare-ipc/medir-latencia", "vantare-profiling/medir-latencia"]

[[bin]]
name = "vantare-overlays-rune"
path = "src/main.rs"
required-features = ["medir-latencia"]

[dependencies]
rune.workspace = true
vantare-domain = { path = "../../domain" }
vantare-ipc = { path = "../../ipc" }
vantare-profiling = { path = "../../profiling" }
serde_json = "1"
