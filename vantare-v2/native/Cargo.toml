[workspace]
resolver = "3"
members = ["launcher", "profiling", "build-support", "domain", "runtime", "ipc", "ui", "hub", "engineer", "storage", "services", "strategy", "admin"]
# DuckDB bundled solo se compila al pedir storage o los gates --workspace.
# Admin es privado: compilarlo explícitamente y excluirlo del instalador público.
default-members = ["domain", "runtime", "ipc", "ui", "hub", "engineer", "services", "strategy"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
vantare-launcher = { path = "launcher" }
vantare-profiling = { path = "profiling" }
vantare-build-support = { path = "build-support" }
vantare-domain = { path = "domain" }
vantare-ipc = { path = "ipc" }
vantare-services = { path = "services", default-features = false }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
# Ruido del modelo (muchos tipos `Snapshot`, `Session`...) sin valor para el lector.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[patch."https://github.com/zed-industries/zed"]
gpui_windows = { path = "vendor/gpui_windows" }

# Solo líneas de depuración: las trazas siguen dando fichero y línea, pero se
# enlaza más rápido y los target/ ocupan ~25 % menos.
[profile.dev]
debug = "line-tables-only"

# Los crates propios conservan fichero/línea; las dependencias no generan símbolos.
# Test hereda dev. Release mantiene su configuración de distribución.
[profile.dev.package."*"]
debug = 0

# El solver de Strategy es cálculo puro con plazo real: optimizado también en debug/tests.
[profile.dev.package.vantare-strategy]
opt-level = 3

# El test del corpus real de telemetría (190 471 fotos con DTO congelado) y la
# suite que lo rodea pasan por domain/runtime/ipc a opt-level 0: es el mayor
# coste aislado de CI (340 s Windows / 303 s Linux medidos en #1654 r8). Mismo
# criterio que el solver: cálculo puro, se compila una vez y el resultado no
# cambia (el test compara los hashes congelados byte a byte, así que si algo
# cambiara fallaría). Si los workers notan más lentos los rebuilds al editar
# estas crates, revertir solo estas líneas.
[profile.dev.package.vantare-domain]
opt-level = 3
[profile.dev.package.vantare-runtime]
opt-level = 3
[profile.dev.package.vantare-ipc]
opt-level = 3

# Hash, JSON y gzip de los corpus de telemetría: optimizados también en dev/test.
# El gate telemetria pasa de 1190 s a 531 s en el servidor (#1465); se compilan una vez.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3

# Decodificar las imágenes del garaje de Strategy (2 PNG de ~1,9 MB + un SVG de 1 KB)
# cuesta ~8 s por test en dev: `Strategy::new` las decodifica siempre y con opt-level 0
# el código de `image`/`png`/`fdeflate` va muy lento. Medido en #1654 r5: los seis
# tests `isa1544_*` (y solo ellos, los que crean un Strategy) tardan 8 s cada uno; el
# resto de tests con headless, 0,02-1 s. Se compilan una vez, como los de arriba.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

# Build para pruebas manuales, no para distribución ni mediciones de rendimiento.
[profile.prueba]
inherits = "release"
opt-level = 0
debug = "line-tables-only"
lto = false
codegen-units = 256
incremental = true

# GPUI y el resto de dependencias mantienen la optimización de Release.
[profile.prueba.package."*"]
opt-level = 3
debug = 0
codegen-units = 16
incremental = false

# El solver conserva el mismo requisito que en dev/test.
[profile.prueba.package.vantare-strategy]
opt-level = 3
