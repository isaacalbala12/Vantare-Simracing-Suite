name: Deploy approved Supabase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Guard and deploy approved Functions
    runs-on: windows-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deployment credentials are configured
        shell: powershell
        run: |
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw "Missing SUPABASE_ACCESS_TOKEN" }
          if (-not $env:SUPABASE_PROJECT_REF) { throw "Missing SUPABASE_PROJECT_REF" }

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.105.0

      - name: Guard and deploy approved Functions
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\supabase\functions\scripts\deploy-approved-functions.ps1" `
            -ProjectRef $env:SUPABASE_PROJECT_REF
