[package]
name = "vantare-telemetry"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "vantare_telemetry"
path = "src/lib.rs"

[[bin]]
name = "vantare-telemetry"
path = "src/main.rs"

[[bench]]
name = "parse_lmu"
harness = false

[[bench]]
name = "engineer_44"
harness = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
ureq = { version = "3.4", default-features = false }
