[package]
name = "vantare-overlays-rune"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

# Workspace aislado: no cambia el lock ni la resolución de GPUI en native/.
[workspace]
resolver = "3"

[dependencies]
# Etiqueta vantare-20261115-1; el rev mantiene inmutable la resolución.
# Sin ogg-audio, diálogos, recarga en caliente ni instrumentación de medición.
rune = { git = "https://github.com/isaacalbala12/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "svg"] }
vantare-domain = { path = "../domain" }
vantare-ipc = { path = "../ipc" }
vantare-profiling = { path = "../profiling" }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/isaacalbala12/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c" }
winit = { git = "https://github.com/isaacalbala12/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c" }
parley_engine = { git = "https://github.com/isaacalbala12/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c" }
accesskit_windows = { git = "https://github.com/isaacalbala12/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c" }

[profile.dev]
debug = 0

[profile.release]
debug = 0
