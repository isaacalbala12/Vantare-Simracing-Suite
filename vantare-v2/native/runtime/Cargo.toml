[package]
name = "vantare-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vantare-domain.workspace = true
vantare-ipc.workspace = true
# Cuerpos REST de LMU (`/rest/watch/*`), decodificados con límites.
serde_json = "1"
# Cliente HTTP síncrono para el REST local de LMU (sin TLS ni gzip: solo 127.0.0.1).
ureq = { version = "3.4", default-features = false }
# Foto latest-wins: los lectores nunca bloquean al escritor (ver core/publish.rs).
arc-swap = "1"

# Lee el corpus temporal `.tar.gz` de 47 coches en streaming (1,17 GB
# descomprimido, no se extrae a disco) para `--replay`.
flate2 = "1"

[dev-dependencies]
# El test de conformidad verifica el SHA-256 del corpus.
sha2 = "0.10"

# Launcher `vantare`: Job Object, mutex de instancia única, señal de parada,
# manejador de Ctrl+C y cierre de ventanas. Ya en Cargo.lock (la usa `ipc`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# Escenarios de caída con procesos de verdad; el propio ejecutable de la prueba
# hace de núcleo y overlays falsos (no hay binarios de prueba que distribuir).
[[test]]
name = "lifecycle"
harness = false

[lints]
workspace = true
