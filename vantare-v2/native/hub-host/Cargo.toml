[package]
name = "vantare-hub-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Unique Cargo artifact while the frozen GPUI Hub still builds in this workspace.
# QA/package preparation installs this binary as bin/vantare-hub.exe.
[[bin]]
name = "vantare-hub-host"
path = "src/main.rs"

[features]
# Opt-in local driver; never enabled by distribution.
qa-e2e = []

[dependencies]
vantare-ipc.workspace = true
vantare-domain.workspace = true
vantare-services.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "=12.0.1"

[lints]
workspace = true
