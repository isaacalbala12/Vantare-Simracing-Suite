[package]
name = "vantare-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["ui", "transport"]
transport = []
ui = ["transport", "dep:gpui", "dep:gpui_platform"]
setup-payload = ["transport"]
test-installer = []
# QA: HWND oculto fuera de los monitores y PrintWindow del banco de #1675.
parity-capture = ["ui", "dep:vantare-ui", "vantare-ui/parity-capture"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ADR 0103 step 3: existing locked SHA, approved ahead of step 4 for reads.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "72d28c32c2ba77a579e1c02f984654518552124b", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "72d28c32c2ba77a579e1c02f984654518552124b", features = ["font-kit"], optional = true }
# Solo con parity-capture; nunca entra en VantareSetup/Uninstall publicados.
vantare-ui = { path = "../ui", optional = true }

[target.'cfg(windows)'.dev-dependencies]
# Enable the existing GPUI test harness; no new library or lockfile dependency.
gpui = { git = "https://github.com/zed-industries/zed", rev = "72d28c32c2ba77a579e1c02f984654518552124b", features = ["test-support"] }

[build-dependencies]
vantare-build-support.workspace = true

[lints]
workspace = true

[[bin]]
name = "vantare-setup"
path = "src/bin/vantare-setup.rs"
required-features = ["transport"]

[[bin]]
name = "vantare-uninstall"
path = "src/bin/vantare-uninstall.rs"
required-features = ["transport"]

[[test]]
name = "contract"
required-features = ["transport"]
