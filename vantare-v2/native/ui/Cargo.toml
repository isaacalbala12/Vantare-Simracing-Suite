[package]
name = "vantare-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Captura con alfa de la ventana (dos pasadas GDI) para la prueba de paridad.
parity-capture = []
# Imprime cada segundo cuántos fotogramas, `render` y pintados hace cada widget.
paint-stats = ["dep:gpui_pre_windows", "gpui_pre_windows/paint-stats"]

[dependencies]
vantare-profiling.workspace = true
vantare-services.workspace = true
vantare-domain.workspace = true
vantare-ipc.workspace = true
# GPUI publicado, compartido por todos los consumidores del workspace.
gpui = { workspace = true }
# Ya en Cargo.lock como transitivas de GPUI; se usan directamente.
flume = "0.12"
png = "0.18"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
gpui_pre_windows = { package = "gpui-pre-windows", version = "=0.3.12", optional = true }
# Ya en el workspace (runtime, ipc, services): icono de bandeja de los overlays.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }


[lints]
workspace = true

[build-dependencies]
vantare-build-support.workspace = true
# Ya utilizada por UI: compila los valores de estilo sin lectura de disco en producto.
serde_json = '1'

[dev-dependencies]
vantare-ipc = { workspace = true, features = ["test-support"] }
# Aprobada por Isaac (#1537): lee los goldens gzip de runtime en los tests de
# replay; misma versión que ya está en Cargo.lock (runtime). Nunca en producto.
flate2 = "1.1.10"
