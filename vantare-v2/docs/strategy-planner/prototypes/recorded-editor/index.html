<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vantare · Estrategia registrada</title>
  <link rel="stylesheet" href="../../../../frontend/src/styles/orbit.tokens.css">
  <link rel="stylesheet" href="../../../../frontend/src/styles/orbit-kit.css">
  <link rel="stylesheet" href="../../../../frontend/src/styles/orbit-shell.css">
  <link rel="stylesheet" href="recorded-editor.css">
</head>
<body>
  <div class="orbit-root">
    <div class="orbit-shell" id="shell">
      <aside class="orbit-rail" aria-label="Vantare" id="rail"></aside>
      <aside class="orbit-column" aria-label="Preparación de la estrategia">
        <div class="orbit-column__head">
          <span class="orbit-column__title">Estrategia</span>
          <button class="orbit-column__collapse" data-action="collapse" aria-label="Plegar preparación">‹</button>
        </div>
        <div class="orbit-column__context">
          <div class="context-label">NUEVA ESTRATEGIA</div>
          <div class="draft"><span class="draft-dot"></span><div><strong>Borrador de carrera</strong><small>Telemetría registrada</small></div></div>
          <div class="context-label steps-label">PREPARACIÓN</div>
          <ol class="steps" id="steps"></ol>
        </div>
        <div class="context-foot"><span class="orbit-pill">LMU</span><span>Archivos registrados</span></div>
      </aside>
      <div class="orbit-main">
        <header class="orbit-topbar">
          <div class="orbit-topbar__tt"><span class="orbit-topbar__eyebrow">Centro operativo</span><h1>Estrategia</h1></div>
          <div class="orbit-topbar__right"><span class="prototype-label">Propuesta visual</span></div>
        </header>
        <main class="recorded-content" id="content"></main>
      </div>
    </div>
  </div>
  <script src="recorded-editor.js"></script>
</body>
</html>
