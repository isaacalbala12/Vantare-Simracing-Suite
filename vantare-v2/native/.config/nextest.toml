[profile.default]
# `lifecycle` usa harness propio (no admite --list): se ejecuta aparte con
# `cargo test --workspace --test lifecycle`.
default-filter = 'not binary(lifecycle)'

# Intermitentes conocidos: se reintentan solos; el resto falla a la primera.
# Quitar cada línea al cerrar su issue (#1434 lanzador, #1435 servicios).
[[profile.default.overrides]]
filter = 'test(chains_run_real_processes_and_report_nonzero_exit_and_spawn_failure) | test(cancellation_interrupts_delay_and_probe_without_starting_the_next_step) | test(actual_process_accepts_its_parent_and_rejects_false_peer_or_nonce)'
retries = 2
