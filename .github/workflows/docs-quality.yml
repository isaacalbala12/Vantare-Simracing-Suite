name: Documentation quality

on:
  pull_request:
  push:
    branches: [nightly, testers]

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate live documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate documentation governance
        run: python .github/scripts/validate_docs.py

      - name: Test documentation validator
        run: python .github/scripts/test_validate_docs.py
