name: Branch channel gates

on:
  push:
    branches: [nightly, testers]
  pull_request:
    branches: [nightly, testers, master]
  merge_group:
    branches: [nightly]
    types: [checks_requested]

permissions:
  contents: read
  issues: read

concurrency:
  group: branch-channel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VANTARE_DIR: "vantare-v2"

jobs:
  policy:
    name: Validate promotion path
    if: '!github.event.repository.private || github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","vantare-1565"]') || 'ubuntu-latest' }}
    outputs:
      # Lo lee `product` para saltarse el trabajo pesado sin dejar de reportar
      # su check requerido. Vacío o distinto de «false» ⇒ los gates corren.
      native: ${{ steps.native_scope.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      # Clasifica si la PR puede saltarse los gates nativos (docs, web retirada,
      # Supabase, tooling). El trabajo `product` sigue ejecutándose y reportando
      # su check requerido: filtrar en `on.pull_request.paths` dejaría los
      # checks requeridos en «Pending» y bloquearía la fusión (docs de GitHub,
      # «Workflow syntax» → on.<push|pull_request>.<paths|paths-ignore>).
      # Fail-closed: sin evento de PR, sin base o si algo falla, `native=true`.
      - name: Clasificar si los gates nativos aplican
        id: native_scope
        shell: bash
        env:
          SCOPE_PATH: ${{ runner.temp }}/native-gate-scope.json
        run: |
          set -euo pipefail
          fail_closed() {
            printf '{"native":true,"native_paths":[],"reasons":["%s"]}\n' "$1" > "$SCOPE_PATH"
            echo 'native=true' >> "$GITHUB_OUTPUT"
          }
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            fail_closed "non pull request event: native gates always run"
            exit 0
          fi
          if ! diff_base="$(git rev-parse "$GITHUB_SHA^1" 2>/dev/null)"; then
            fail_closed "no diff base: fail closed"
            exit 0
          fi
          if ! git diff --name-only --diff-filter=ACMR -z "$diff_base" "$GITHUB_SHA" > "$RUNNER_TEMP/native-scope-paths.bin"; then
            fail_closed "git diff failed: fail closed"
            exit 0
          fi
          native="true"
          if ! native="$(python .github/scripts/native_gate_scope.py --nul-file "$RUNNER_TEMP/native-scope-paths.bin" --output "$SCOPE_PATH")"; then
            fail_closed "classifier failed: fail closed"
            exit 0
          fi
          case "$native" in
            true|false) ;;
            *) native="true" ;;
          esac
          cat "$SCOPE_PATH"
          echo "native=$native" >> "$GITHUB_OUTPUT"

      - name: Check branch topology
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BASE: ${{ github.base_ref }}
          EVENT_HEAD: ${{ github.head_ref }}
        run: |
          python .github/scripts/validate_branch_channels.py \
            --event "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --base "$EVENT_BASE" \
            --head "$EVENT_HEAD"

      - name: Test branch topology policy
        run: python .github/scripts/test_validate_branch_channels.py

      - name: Test public roadmap contracts offline
        run: |
          python -B -m unittest discover -s vantare-v2/scripts -p 'test*roadmap*.py'
          node --test vantare-v2/scripts/test_roadmap_web.mjs

      - name: Test Testing Center deterministic diff gate
        run: python .github/scripts/test_testing_center_diff_gate.py

      - name: Test native gate path scope
        run: python .github/scripts/test_native_gate_scope.py

      - name: Test Testing Center trusted manifest collector
        run: python .github/scripts/test_testing_center_manifest_collector.py
      - name: Test Testing Center changed lint scope
        run: python .github/scripts/test_testing_center_changed_lint.py

      - name: Test inert Testing Center merge queue policy
        run: python .github/scripts/test_testing_center_merge_queue.py

      - name: Test release notes rendering and its gate
        run: python .github/scripts/tests/test_release_notes.py

      - name: Test private runner hooks and artifact budget
        run: |
          python -m unittest discover -s tools/ci-runners -v
          python -m unittest discover -s .github/scripts -p test_artifact_budget.py -v

      - name: Test inert Testing Center Nightly closeout policies
        run: |
          python .github/scripts/test_testing_center_nightly_closeout.py -v
          python .github/scripts/test_testing_center_agent_callback.py -v

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: 2.7.13

      - name: Test Testing Center agent workflow contract
        run: deno test --no-lock --allow-read=.github/workflows,.github/agents,supabase/tests/testing-center-agent-workflow-contract.test.ts supabase/tests/testing-center-agent-workflow-contract.test.ts

      - name: Test Testing Center callback and deploy surface
        run: |
          deno test --no-lock --allow-read --allow-env \
            supabase/functions/testing-center-agent-callback/index.test.ts \
            supabase/functions/_shared/testing-center-agent-observability.test.ts \
            supabase/functions/scripts/verify-deploy-surface.test.ts

  product:
    name: Validate Vantare blocking gates
    needs: policy
    if: '!github.event.repository.private || github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Windows","X64","vantare-1565"]') || 'windows-latest' }}
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      # Todos los pasos pesados se saltan cuando la PR solo toca zonas sin
      # efecto nativo (lo decide `policy.native`). El trabajo sigue corriendo y
      # reportando «success» porque es un check requerido de la rama: filtrar
      # en el disparador lo dejaría en «Pending» y bloquearía la fusión.
      - name: Wait until Windows screen is available
        if: needs.policy.outputs.native != 'false'
        working-directory: ${{ runner.temp }}
        run: |
          while (Test-Path 'C:/tmp/fase2/pantalla-ocupada') { Start-Sleep -Seconds 10 }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.policy.outputs.native != 'false'
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Classify changed automatic scope
        if: needs.policy.outputs.native != 'false'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AUTOMATIC_TC_SCOPE: ${{ startsWith(github.head_ref, 'vantareapp/tc-') }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_SCOPE_PATH: ${{ runner.temp }}/testing-center-changed-scope.json
        run: |
          set -euo pipefail
          if [ "$AUTOMATIC_TC_SCOPE" != "true" ]; then
            printf '%s\n' '{"eligible":true,"lint_paths":[],"reasons":[],"visual_required":false}' > "$CHANGED_SCOPE_PATH"
            exit 0
          fi
          test "$EVENT_NAME" = "pull_request"
          DIFF_BASE_SHA="$(git rev-parse "$GITHUB_SHA^1")"
          git diff --name-only --diff-filter=ACMR -z "$DIFF_BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths.bin"
          python .github/scripts/testing_center_changed_lint.py \
            --nul-file "$RUNNER_TEMP/changed-paths.bin" \
            --output "$CHANGED_SCOPE_PATH" \
            --enforce-testing-center-scope

      - name: Reject retired automatic UI scope
        if: needs.policy.outputs.native != 'false'
        run: |
          $scope = Get-Content "$env:RUNNER_TEMP/testing-center-changed-scope.json" -Raw | ConvertFrom-Json
          if (-not $scope.eligible -or $scope.lint_paths.Count -gt 0 -or $scope.visual_required) {
            throw "automatic frontend scope retired; no native preauthorization is granted"
          }

      - name: Test Windows runner hooks and beta feed origin
        if: needs.policy.outputs.native != 'false'
        run: |
          python -m unittest discover -s ../tools/ci-runners -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Windows PowerShell 5.1, el mismo host que ejecuta beta.ps1 instalado.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File native/packaging/feed-origin-tests.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Caché de los artefactos de *dependencias* (rust-cache borra antes de
      # guardar los crates del workspace y el fork vendorizado, y limpia el
      # incremental). Incluye el registro y el clon git de Cargo (~1 GB, zed
      # 388 MB): sustituye a la caché `cargo-registry` de la ronda 1. Apunta a
      # target/gates, el --target-dir que usa gates.ps1. La clave la calcula la
      # acción con rustc, las variables CARGO/RUST/CC y el Cargo.lock/Cargo.toml
      # de todo el repo: no cambia por PR, y si cambia el lock restaura la
      # entrada anterior. Un cache creado en una PR solo lo ve esa PR; los del
      # push a nightly los comparten todas las PRs con esa base (docs de
      # GitHub: «Restrictions for accessing a cache»). Para invalidar a mano:
      # subir `prefix-key`. Nota: la línea de la acción no lleva comentario de
      # versión al final porque el test del flujo de canales exige que acabe en
      # el SHA fijado.
      - name: Cache de artefactos de dependencias (target)
        if: needs.policy.outputs.native != 'false'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            vantare-v2/native -> target/gates
          shared-key: native-windows-gates
          # El binario de nextest se cachea aparte: no guardar ~/.cargo/bin dos veces.
          cache-bin: "false"

      # El binario solo cambia al subir la versión: se guarda en caché y se
      # evita recompilarlo (342–430 s por trabajo aquí; 174–226 s en Linux).
      - name: Cache de cargo-nextest
        if: needs.policy.outputs.native != 'false'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-nextest.exe
          key: cargo-nextest-0.9.146-${{ runner.os }}-${{ runner.arch }}

      - name: Install native test runner
        if: needs.policy.outputs.native != 'false'
        working-directory: ${{ env.VANTARE_DIR }}/native
        run: |
          # Prueba esta comprobación también con caché CALIENTE: un falso
          # negativo (pasó con `--version` multilínea en Linux) no debe tumbar
          # el trabajo; --force reinstala encima de lo que ya haya.
          $have = ''
          $exe = Join-Path $env:USERPROFILE '.cargo\bin\cargo-nextest.exe'
          if (Test-Path -LiteralPath $exe) {
            try { $have = (& $exe --version 2>$null) -join "`n" } catch { $have = '' }
          }
          $first = ($have -split "`n")[0].Trim()
          "cargo-nextest encontrado: '$first'"
          if ($first -match 'cargo-nextest 0\.9\.146') {
            'cargo-nextest 0.9.146 ya disponible: no se instala'
          } else {
            cargo install cargo-nextest --locked --version 0.9.146 --force
          }

      - name: Fetch locked native dependencies
        if: needs.policy.outputs.native != 'false'
        working-directory: ${{ env.VANTARE_DIR }}/native
        run: cargo fetch --locked

      - name: Install verified DuckDB development library
        if: needs.policy.outputs.native != 'false'
        working-directory: ${{ env.VANTARE_DIR }}/native
        run: ./setup-duckdb.ps1

      - name: Native format and blocking gates
        if: needs.policy.outputs.native != 'false'
        working-directory: ${{ env.VANTARE_DIR }}/native
        shell: pwsh
        env:
          # Compilación con los 4 vCPU del runner hosted (16 GB); gates.ps1 lo
          # aplica a -j y a --build-jobs (#1654 ronda 2).
          CARGO_BUILD_JOBS: '4'
          # Cuatro hilos de test (el runner tiene 4 vCPU). Los 7 tests con
          # plazos de reloj duros de 1-3 s (ipc, launcher y runtime) llevan
          # threads-required en .config/nextest.toml: corren solos y primero, así
          # que no dependen de la CPU que quede. Si aparecen intermitentes,
          # volver a 2 y anotarlo en el cuaderno de #1654.
          NEXTEST_TEST_THREADS: '4'
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { throw "native format failed" }
          foreach ($gate in @('check', 'clippy', 'test', 'lifecycle', 'telemetria')) {
            ./gates.ps1 -Gate $gate
            if ($LASTEXITCODE) { throw "native $gate failed" }
          }

      - name: Verify retained fixtures and references
        if: needs.policy.outputs.native != 'false'
        run: python native/retirement/verify.py
