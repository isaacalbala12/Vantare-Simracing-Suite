name: Hub contract portable
on:
  pull_request:
    branches: [nightly]
    paths: ['vantare-v2/native/hub-host/**', 'vantare-v2/native/ipc/**', 'vantare-v2/native/services/**', '.github/workflows/hub-contract-portable.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-contract-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: vantare-v2/native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hub-contract-target" >> "$GITHUB_ENV"
          rustup show active-toolchain
      - name: Exercise production dispatch with every module corpus on Linux
        run: cargo test --locked -p vantare-hub-host --lib dispatch_contract_tests
      - name: Check parser rejection cases and rustfmt of owned sources
        run: cargo test --locked -p vantare-hub-host --lib wire_source_tests

  host-writer-bytes:
    name: host-writer-bytes (${{ matrix.order }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        order: [sorted, insertion]
    env:
      CARGO_BUILD_JOBS: '2'
      VANTARE_EXPECT_JSON_ORDER: ${{ matrix.order }}
    defaults:
      run:
        working-directory: vantare-v2/native
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/hub-writer-target" >> $env:GITHUB_ENV
          "VANTARE_NATIVE_DATA_ROOT=$env:RUNNER_TEMP/hub-writer-data" >> $env:GITHUB_ENV
          rustup show active-toolchain
      - name: Pin writer bytes with an isolated host feature graph
        run: |
          $extra = @()
          if ('${{ matrix.order }}' -eq 'insertion') {
            $extra = @('--features', 'serde_json/preserve_order')
          }
          cargo test --locked -p vantare-hub-host --lib writer_bytes @extra
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
