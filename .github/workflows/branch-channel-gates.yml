name: Branch channel gates

on:
  push:
    branches: [nightly, testers]
  pull_request:
    branches: [nightly, testers, master]
  merge_group:
    branches: [nightly]
    types: [checks_requested]

permissions:
  contents: read
  issues: read

concurrency:
  group: branch-channel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VANTARE_DIR: "vantare-v2"

jobs:
  policy:
    name: Validate promotion path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check branch topology
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BASE: ${{ github.base_ref }}
          EVENT_HEAD: ${{ github.head_ref }}
        run: |
          python .github/scripts/validate_branch_channels.py \
            --event "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --base "$EVENT_BASE" \
            --head "$EVENT_HEAD"

      - name: Test branch topology policy
        run: python .github/scripts/test_validate_branch_channels.py

      - name: Test Testing Center deterministic diff gate
        run: python .github/scripts/test_testing_center_diff_gate.py

      - name: Test Testing Center trusted manifest collector
        run: python .github/scripts/test_testing_center_manifest_collector.py
      - name: Test Testing Center changed lint scope
        run: python .github/scripts/test_testing_center_changed_lint.py

      - name: Test inert Testing Center merge queue policy
        run: python .github/scripts/test_testing_center_merge_queue.py

      - name: Test release notes rendering and its gate
        run: python .github/scripts/tests/test_release_notes.py

      - name: Test inert Testing Center Nightly closeout policies
        run: |
          python .github/scripts/test_testing_center_nightly_closeout.py -v
          python .github/scripts/test_testing_center_agent_callback.py -v

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: 2.7.13

      - name: Test Testing Center agent workflow contract
        run: deno test --no-lock --allow-read=.github/workflows,.github/agents,supabase/tests/testing-center-agent-workflow-contract.test.ts supabase/tests/testing-center-agent-workflow-contract.test.ts

      - name: Test Testing Center callback and deploy surface
        run: |
          deno test --no-lock --allow-read --allow-env \
            supabase/functions/testing-center-agent-callback/index.test.ts \
            supabase/functions/_shared/testing-center-agent-observability.test.ts \
            supabase/functions/scripts/verify-deploy-surface.test.ts

  product:
    name: Validate Vantare blocking gates
    needs: policy
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Classify changed automatic scope
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AUTOMATIC_TC_SCOPE: ${{ startsWith(github.head_ref, 'vantareapp/tc-') }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_SCOPE_PATH: ${{ runner.temp }}/testing-center-changed-scope.json
        run: |
          set -euo pipefail
          if [ "$AUTOMATIC_TC_SCOPE" != "true" ]; then
            printf '%s\n' '{"eligible":true,"lint_paths":[],"reasons":[],"visual_required":false}' > "$CHANGED_SCOPE_PATH"
            exit 0
          fi
          test "$EVENT_NAME" = "pull_request"
          DIFF_BASE_SHA="$(git rev-parse "$GITHUB_SHA^1")"
          git diff --name-only --diff-filter=ACMR -z "$DIFF_BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths.bin"
          python .github/scripts/testing_center_changed_lint.py \
            --nul-file "$RUNNER_TEMP/changed-paths.bin" \
            --output "$CHANGED_SCOPE_PATH" \
            --enforce-testing-center-scope

      - name: Reject retired automatic UI scope
        run: |
          $scope = Get-Content "$env:RUNNER_TEMP/testing-center-changed-scope.json" -Raw | ConvertFrom-Json
          if (-not $scope.eligible -or $scope.lint_paths.Count -gt 0 -or $scope.visual_required) {
            throw "automatic frontend scope retired; no native preauthorization is granted"
          }

      - name: Install native test runner
        working-directory: ${{ env.VANTARE_DIR }}/native
        run: cargo install cargo-nextest --locked --version 0.9.146

      - name: Fetch locked native dependencies
        working-directory: ${{ env.VANTARE_DIR }}/native
        run: cargo fetch --locked

      - name: Install verified DuckDB development library
        working-directory: ${{ env.VANTARE_DIR }}/native
        run: ./setup-duckdb.ps1

      - name: Native format and blocking gates
        working-directory: ${{ env.VANTARE_DIR }}/native
        shell: pwsh
        env:
          NEXTEST_TEST_THREADS: '1'
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { throw "native format failed" }
          foreach ($gate in @('check', 'clippy', 'test', 'lifecycle', 'telemetria')) {
            ./gates.ps1 -Gate $gate
            if ($LASTEXITCODE) { throw "native $gate failed" }
          }

      - name: Verify retained fixtures and references
        run: python native/retirement/verify.py
