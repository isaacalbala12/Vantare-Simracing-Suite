[package]
name = "vantare-services"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Workspace aislado dentro de las rutas del worker. Opus integra los manifests
# del workspace/Hub; no se modifica la configuración de otros workers.
[workspace]

[dependencies]
base64 = "0.22"
vantare-ipc = { path = "../ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
