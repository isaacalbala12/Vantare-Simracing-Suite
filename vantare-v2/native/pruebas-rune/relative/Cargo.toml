[package]
name = "vantare-overlays-rune"
version = "0.0.0"
edition = "2024"
publish = false

[features]
medir-latencia = ["vantare-ipc/medir-latencia", "vantare-profiling/medir-latencia"]

[[bin]]
name = "vantare-overlays-rune"
path = "src/main.rs"
required-features = ["medir-latencia"]

[dependencies]
rune.workspace = true
vantare-domain = { path = "../fuentes-generadas/gpui/vantare-v2/native/domain" }
vantare-ipc = { path = "../fuentes-generadas/gpui/vantare-v2/native/ipc" }
vantare-profiling = { path = "../fuentes-generadas/gpui/vantare-v2/native/profiling" }
serde_json = "1"
