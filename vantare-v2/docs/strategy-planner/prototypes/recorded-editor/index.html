<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vantare · Preparar carrera</title>
<style>
:root{color-scheme:dark;--bg:#101113;--panel:#191b1e;--line:#32353a;--muted:#b1b5bd;--accent:#f3aa62;--text:#f3f3f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);color:inherit;background:#202226;border-radius:7px;padding:11px 17px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--accent)}.brand{font-size:18px;letter-spacing:4px;font-weight:750}.top{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 32px;gap:20px}.top small{color:var(--muted)}.badge{border:1px solid #785638;color:#f4bd88;border-radius:30px;padding:4px 12px;font-size:12px}.shell{display:grid;grid-template-columns:208px 1fr;min-height:calc(100vh - 72px)}aside{border-right:1px solid var(--line);padding:28px 18px}aside p{font-size:11px;letter-spacing:2px;color:var(--muted);padding:0 12px}aside .nav{padding:11px 12px;margin:4px 0;color:var(--muted)}aside .active{background:#30271f;border-left:2px solid var(--accent);color:#f4bd88;border-radius:3px}main{max-width:1360px;width:100%;padding:34px 48px 45px;margin:auto}.eyebrow{color:var(--accent);letter-spacing:2px;font-size:11px;text-transform:uppercase}.progress{display:flex;gap:7px;margin:22px 0 38px}.progress span{height:3px;background:var(--line);flex:1}.progress .done{background:var(--accent)}h1{font-size:clamp(30px,3vw,46px);letter-spacing:-1.4px;line-height:1.15;margin:12px 0 14px;font-weight:600}h2{font-size:22px;font-weight:550;margin:0 0 10px}h3{margin:0 0 6px;font-size:16px}p{margin:0 0 16px}.muted{color:var(--muted)}.intro{max-width:700px;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:25px;text-align:left}.choice{display:block;width:100%;min-height:152px}.choice.selected{border-color:var(--accent);background:#29231e}.choice .number{color:var(--accent);display:block;font-size:13px;margin-bottom:18px}.choice strong{font-size:21px;display:block;font-weight:550;margin-bottom:8px}.choice span{display:block;color:var(--muted)}.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:38px;padding-top:22px;gap:14px}.primary{color:#17120e;background:var(--accent);border-color:var(--accent);font-weight:650}.subtle{background:transparent}.note{border-left:2px solid #bc9a63;padding:10px 16px;color:#d1c3ad;margin-top:22px;background:#24221e}.fields{display:grid;grid-template-columns:1fr 1fr;gap:22px}label{display:block;color:var(--muted);font-size:13px}input,select{display:block;width:100%;background:#121315;border:1px solid #4a4d54;color:var(--text);padding:12px;border-radius:6px;margin-top:8px}.stats{display:flex;gap:32px;margin:24px 0}.stats strong{font-size:29px;font-weight:500;display:block}.stats small{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row button{padding:7px 12px;font-size:13px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px}.stack{display:grid;gap:18px}.tabs{display:flex;gap:10px;margin:25px 0}.tabs .on{border-color:var(--accent);color:var(--accent)}.empty{padding:36px 12px;text-align:center}.empty .dash{font-size:40px;color:#7b808a}.pill{font-size:12px;color:#bfcec4;background:#26302a;padding:4px 9px;border-radius:5px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:14px 10px}th{font-weight:500;color:var(--muted)}details{margin-top:16px}summary{cursor:pointer;color:var(--accent)}.backlink{padding:0;border:0;background:none;color:var(--muted)}#announce{min-height:24px;color:var(--accent);font-size:13px;margin-top:12px}footer small{color:var(--muted)}@media(max-width:1000px){main{padding:28px}.shell{grid-template-columns:150px 1fr}.workspace{grid-template-columns:1fr}.grid,.fields{grid-template-columns:1fr}.top{padding:0 20px}}@media(max-width:650px){.shell{display:block}aside{display:none}.top small{display:none}main{padding:23px 18px}.stats{gap:24px}.top{height:64px}.footer{flex-wrap:wrap}}
</style>
<header class="top"><div class="brand">VANTARE <small> / STRATEGY</small></div><span class="badge">Propuesta de interfaz · sin cálculo</span></header>
<div class="shell"><aside aria-label="Contexto de Vantare"><p>COMPETICIÓN</p><div class="nav active">Strategy</div><div class="nav">Calendario</div><div class="nav">Telemetry Analysis</div><p style="margin-top:45px">ESTA PROPUESTA</p><div class="nav">Telemetría registrada</div><div class="nav" style="font-size:12px">Live · fase posterior</div></aside><main id="main"></main></div>
<script>
const sources={imola:{track:'Imola',layout:'Autodromo Enzo e Dino Ferrari',car:'United Autosports #21:ELMS25',category:'LMP2 ELMS',date:'6 junio 2026',laps:38,record:'Referencia inicial de carrera',pit:'54,12 s',fuel:'25,715 L',entry:'2874,12',exit:'2928,24',offset:'25,44 s',crossings:38},algarve:{track:'Algarve',layout:'Algarve International Circuit',car:'Oreca 07 ELMS Custom Team 2025 #397',category:'LMP2 ELMS',date:'11 julio 2026',laps:70,record:'Grabación parcial · vueltas 101–171',pit:'75,00 s',fuel:'74,725 L',entry:'13513,52',exit:'13588,52',offset:'10104,62 s',crossings:70}};
const state={step:0,mode:'manual',combo:'imola',duration:'',unit:'minutos',driver:'',weather:'Por confirmar',include:true,advanced:false,undo:null,copy:false};
const names=['Inicio','Simulador','Evento','Coche y circuito','Reglas','Pilotos','Telemetría'];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function choice(id,title,desc,selected,action){return `<button class="card choice ${selected?'selected':''}" aria-pressed="${selected}" onclick="${action}"><span class="number">${id}</span><strong>${title}</strong><span>${desc}</span></button>`}
function choose(key,value){state[key]=value;render()}
function next(){state.step++;render(true)}function prev(){state.step=Math.max(0,state.step-1);render(true)}function edit(step){state.step=step;render(true)}
function toggleSource(){state.undo=state.include;state.include=!state.include;render();document.getElementById('announce').textContent='Selección cambiada en esta propuesta. El archivo original permanece intacto.'}
function undo(){if(state.undo!==null){state.include=state.undo;state.undo=null;render();document.getElementById('announce').textContent='Selección anterior restaurada.'}}
function render(focus=false){let s=sources[state.combo],content='',title='',intro='';
if(state.step===0){title='Prepara tu próxima carrera.';intro='De tus sesiones registradas a una estrategia que puedas revisar y explicar.';content=`<div class="grid">${choice('01','Manual','Elige el evento, configura sus reglas y revisa las sesiones compatibles.',state.mode==='manual',"choose('mode','manual')")}${choice('02','Automático','Parte de las sesiones encontradas en tus ubicaciones autorizadas.',state.mode==='auto',"choose('mode','auto')")}</div><p class="note">Ambos recorridos calculan desde telemetría. Manual se refiere a la preparación de la carrera.</p>`}
if(state.step===1){title='Elige el simulador.';intro='Cada formato aporta las señales que realmente contiene.';content=`<div class="grid">${choice('DISPONIBLE','Le Mans Ultimate','Sesiones registradas · DuckDB',true,'next()')}<div class="card muted"><h2>Otros simuladores</h2><p>Se incorporarán con sus formatos y capacidades. No están disponibles en esta primera entrega.</p></div></div>`}
if(state.step===2){title=state.mode==='auto'?'Tus sesiones, un punto de partida.':'¿Qué carrera vas a preparar?';intro=state.mode==='auto'?'La propuesta muestra dos fuentes reales ya autorizadas para desarrollo. No está realizando una búsqueda nueva.':'Usa las reglas de un evento o prepara una carrera personalizada.';content=`<div class="grid">${choice('PERSONALIZADA','Crear carrera','Define duración, participantes y reglas.',true,'next()')}<div class="card"><h2>Desde el calendario</h2><p class="muted">La propuesta no consulta tu calendario. En la app aparecerán aquí tus eventos compatibles.</p><button disabled>Seleccionar evento</button></div></div>`}
if(state.step===3){title='Coche y circuito.';intro='Estas combinaciones tienen sesiones reales. Cada combinación conserva su propia selección de telemetría.';content=`<div class="grid">${Object.entries(sources).map(([id,x])=>choice(x.category,x.track,esc(x.car)+'<br>'+x.date+' · '+x.laps+' vueltas registradas',state.combo===id,`choose('combo','${id}')`)).join('')}</div>`}
if(state.step===4){title='Las reglas de tu carrera.';intro='La duración de una grabación no determina automáticamente la duración del evento que quieres preparar.';content=`<div class="card fields"><label>Duración o distancia<input type="number" min="1" placeholder="Por confirmar" value="${esc(state.duration)}" oninput="state.duration=this.value"></label><label>Unidad<select onchange="state.unit=this.value"><option ${state.unit==='minutos'?'selected':''}>minutos</option><option ${state.unit==='vueltas'?'selected':''}>vueltas</option></select></label><label>Condiciones<select onchange="state.weather=this.value">${['Por confirmar','Seco','Mojado','Variables'].map(x=>`<option ${state.weather===x?'selected':''}>${x}</option>`).join('')}</select></label><div><h3>Fuel y energía virtual</h3><p class="muted">Capacidad, reserva y aplicabilidad deben confirmarse para el evento.</p></div></div><details class="card"><summary>Reglas que completará el editor</summary><p class="muted">Ventanas de parada, inventario y cambios de neumáticos, servicio simultáneo, límite de stint y cambios de piloto. Sin valores asumidos en esta propuesta.</p></details>`}
if(state.step===5){title='¿Quién va a conducir?';intro='Cada piloto conserva su ritmo observado o una estimación explícita.';content=`<div class="card fields"><label>Piloto principal<input value="${esc(state.driver)}" placeholder="Nombre del piloto" oninput="state.driver=this.value"></label><div><h3>Relevos de resistencia</h3><p class="muted">El editor permitirá ordenar pilotos y ajustar su ritmo estimado. Copiar un ritmo siempre quedará señalado.</p><button disabled>Añadir relevo · pendiente en esta propuesta</button></div></div>`}
if(state.step===6){title='Revisa la telemetría.';intro='La fuente encaja con tu coche y circuito. Tú decides si forma parte del plan.';content=`<div class="card"><div class="row"><div><h2>${s.track} · ${s.date}</h2><p class="muted">${esc(s.car)}</p></div><span class="pill">${s.laps} vueltas</span></div><div class="stats"><div><strong>1</strong><small>Fuente compatible</small></div><div><strong>1</strong><small>Parada completa observada</small></div></div><p>${s.record}</p><p class="muted">Estas cifras describen el banco de desarrollo. La calidad para ritmo, consumo y desgaste todavía necesita validación.</p><label><input type="checkbox" style="display:inline;width:auto;margin-right:8px" ${state.copy?'checked':''} onchange="state.copy=this.checked"> Quiero conservar una copia en una carpeta elegida</label><p class="muted" style="font-size:12px;margin-top:10px">Preferencia demostrativa: esta propuesta no copia archivos.</p></div>`}
if(state.step>=7){renderWorkspace(s,focus);return}
document.getElementById('main').innerHTML=`<div class="eyebrow">Preparación / ${names[state.step]}</div><div class="progress" aria-label="Paso ${state.step+1} de 7">${names.map((_,i)=>`<span class="${i<=state.step?'done':''}"></span>`).join('')}</div><h1 tabindex="-1">${title}</h1><p class="intro muted">${intro}</p>${content}<div class="footer"><button class="subtle" onclick="prev()" ${state.step===0?'disabled':''}>← Atrás</button><span class="muted">${state.step+1} / 7</span><button class="primary" onclick="next()">${state.step===6?'Abrir borrador':'Continuar'} →</button></div>`;if(focus)document.querySelector('h1').focus()}
function renderWorkspace(s,focus){document.getElementById('main').innerHTML=`<button class="backlink" onclick="edit(6)">← Volver a la preparación</button><div class="row" style="border:0;padding-bottom:0"><div><div class="eyebrow">STRATEGY / BORRADOR</div><h1 tabindex="-1">${s.track}</h1><p class="muted">${esc(s.car)} · ${esc(state.duration||'Duración pendiente')} ${state.duration?esc(state.unit):''}</p></div><button disabled>Guardar revisión</button></div><div class="tabs"><button class="${!state.advanced?'on':''}" onclick="choose('advanced',false)">Resumen</button><button class="${state.advanced?'on':''}" onclick="choose('advanced',true)">Revisión de datos</button></div><div class="workspace"><div class="stack">${state.advanced?advanced(s):`<section class="card"><div class="row"><h2>Tu carrera</h2><button onclick="edit(4)">Editar reglas</button></div><div class="row"><span>Condiciones</span><strong>${esc(state.weather)}</strong></div><div class="row"><span>Piloto</span><button onclick="edit(5)">${esc(state.driver||'Por confirmar')}</button></div><div class="row"><span>Neumáticos, Fuel y energía virtual</span><span class="muted">Reglas pendientes</span></div></section><section class="card"><div class="row"><h2>Datos para el cálculo</h2><button onclick="choose('advanced',true)">Revisar</button></div><div class="row"><span>Ritmo representativo</span><span class="muted">Pendiente de validar</span></div><div class="row"><span>Consumo y desgaste</span><span class="muted">Pendiente de validar</span></div><div class="row"><span>Parada observada completa</span><span>${s.pit} · ${s.fuel} añadidos*</span></div><p class="muted" style="font-size:12px;margin-top:14px">* Suma de incrementos positivos de combustible. Una parada observada no fija el coste de todas las estrategias.</p></section>`}<section class="card"><div class="row"><div><h3>${s.track} · ${s.date}</h3><span class="muted">Fuente ${state.include?'seleccionada':'excluida del borrador'}</span></div><button onclick="toggleSource()">${state.include?'Excluir del plan':'Incluir en el plan'}</button></div><div class="row"><span class="muted">Original intacto · cambios locales a esta propuesta</span><button onclick="undo()" ${state.undo===null?'disabled':''}>Deshacer</button></div><div id="announce" role="status" aria-live="polite"></div></section></div><section class="card" style="align-self:start"><div class="eyebrow">PROPUESTA DE CARRERA</div><div class="empty"><div class="dash">—</div><h2>Aún sin calcular</h2><p class="muted">${state.include?'Completa las reglas y valida las observaciones para poder generar una estrategia.':'Selecciona al menos una fuente compatible para continuar.'}</p></div><button class="primary" style="width:100%" disabled>Calcular estrategia</button><p class="muted" style="font-size:12px;margin-top:14px">El prototipo permite revisar la experiencia. No ejecuta el motor ni guarda revisiones.</p></section></div>`;if(focus)document.querySelector('h1').focus()}
function advanced(s){return `<section class="card"><div class="row"><h2>Observaciones de la sesión</h2><span class="pill">Banco de desarrollo</span></div><p class="muted">${s.record}. No se asignan etiquetas automáticas de incidente en esta propuesta.</p><div class="tablewrap"><table><thead><tr><th>Observación</th><th>Valor</th><th>Estado</th></tr></thead><tbody><tr><td>Entrada a boxes</td><td>${s.entry} s</td><td>Evento observado</td></tr><tr><td>Salida de boxes</td><td>${s.exit} s</td><td>Evento observado</td></tr><tr><td>Fuel añadido en visita completa</td><td>${s.fuel}</td><td>Contraste exploratorio</td></tr><tr><td>Incidentes / vueltas invalidadas</td><td>Sin adjudicar</td><td>Revisión pendiente</td></tr></tbody></table></div><details><summary>Procedencia y correspondencia temporal</summary><p class="muted">Ajuste por ${s.crossings} cruces de meta: ${s.offset}; residuo máximo 0,04 s. No equivale a una precisión certificada del modelo de carrera. Los valores proceden del contraste de #1030.</p></details></section>`}
render();
</script></html>
