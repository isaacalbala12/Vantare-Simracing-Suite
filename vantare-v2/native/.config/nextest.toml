[profile.default]
# Cuatro tests a la vez (núcleos físicos del servidor de workers, #1465). Con 8 los
# tests de triage superan su plazo; NEXTEST_TEST_THREADS (CI) tiene prioridad.
test-threads = 4
# `lifecycle` usa harness propio (no admite --list): se ejecuta aparte con
# `cargo test --workspace --test lifecycle`.
# Réplicas de grabaciones reales de telemetría (~9 min): solo en `gates.ps1 -Gate telemetria`
# cuando el cambio toca runtime, domain, ipc o testdata (AGENTS.md, #1498).
default-filter = 'not binary(lifecycle) & not (package(vantare-runtime) & (binary(telemetry_golden) | binary(acc_conformance) | binary(lmu_conformance) | binary(lmu_oracle)))'

[profile.telemetria]
default-filter = 'package(vantare-runtime) & (binary(telemetry_golden) | binary(acc_conformance) | binary(lmu_conformance) | binary(lmu_oracle))'

# Intermitentes conocidos: se reintentan solos; el resto falla a la primera.
# Quitar cada línea al cerrar su issue (#1434 lanzador).
[[profile.default.overrides]]
filter = 'test(chains_run_real_processes_and_report_nonzero_exit_and_spawn_failure) | test(cancellation_interrupts_delay_and_probe_without_starting_the_next_step)'
retries = 2

# Busca procesos con la imagen del binario de tests: con nextest cada test es un
# proceso de ese binario, así que debe correr solo para encontrar el suyo.
[[profile.default.overrides]]
filter = 'test(win32_reads_actual_process_identity_and_registry_without_writing_them)'
threads-required = 'num-test-threads'

# Cada test de triage lanza powershell.exe con un plazo de 8 s: más de dos a la
# vez lo agotan en un servidor cargado (#1465).
[test-groups]
triage-powershell = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(vantare-services) & test(/^triage::tests::/)'
test-group = 'triage-powershell'

# Los tests más largos (>15 s) arrancan primero para no quedar solos al final.
[[profile.default.overrides]]
filter = 'test(/^solver::parity_tests::go_/) | test(/^triage::tests::review_r[234]_f/) | test(golden_corpora_reach_every_widget) | test(mutated_and_truncated_real_frames_never_panic) | test(/^strategy::state_tests::isa1544_/)'
priority = 50
