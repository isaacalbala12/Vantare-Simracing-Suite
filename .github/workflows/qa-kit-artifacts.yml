# .github/workflows/qa-kit-artifacts.yml
# Objetivo: construir en GitHub (gratis, windows-latest) los binarios del kit de la tanda del PC con el MISMO SHA
# congelado y publicarlos como artefacto con hashes, sin compilar en el servidor.
# Disparo: push a una rama `qa-kit/<sha8>` que apunta a un commit de nightly que YA contiene este workflow
# (workflow_dispatch exige el fichero en la rama por defecto, master; el push lee el workflow del commit empujado).
# Seguridad: permissions contents:read, sin secretos, sin despliegue, sin escribir en el repo; solo si el commit
# es ancestro de origin/nightly; las acciones fijadas por SHA como en el resto de workflows del repo.
name: QA kit artifacts

on:
  push:
    branches: ['qa-kit/**']
  pull_request:
    paths: ['.github/workflows/qa-kit-artifacts.yml']   # el PR del propio workflow demuestra que compila

permissions:
  contents: read

concurrency:
  group: qa-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Binarios del kit de la tanda (Release, sin ejecutar)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      VANTARE_SIN_GRAFICOS: '1'          # nada de gráficos en el runner; solo se compila
      VANTARE_BUILD_CHANNEL: nightly
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_BUILD_JOBS: '4'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: El commit debe ser de nightly (solo en push; el PR del workflow se salta esta comprobación)
        if: github.event_name == 'push'
        run: |
          git fetch origin nightly
          git merge-base --is-ancestor HEAD origin/nightly
          if ($LASTEXITCODE) { throw 'qa-kit solo acepta commits que ya estén en nightly' }
      - name: Rust fijado
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Targets separados (workspace principal y overlays-rune)
        run: |
          "TARGET_MAIN=$env:RUNNER_TEMP/qa-kit-target-main" >> $env:GITHUB_ENV
          "TARGET_RUNE=$env:RUNNER_TEMP/qa-kit-target-rune" >> $env:GITHUB_ENV
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: qa-kit-1.99.1-${{ hashFiles('vantare-v2/native/Cargo.lock', 'vantare-v2/native/overlays-rune/Cargo.lock') }}
          restore-keys: qa-kit-1.99.1-
      - name: Compilar Rune (Release) y verificar subsistema Windows GUI
        working-directory: vantare-v2/native/overlays-rune
        env:
          CARGO_TARGET_DIR: ${{ env.TARGET_RUNE }}
        run: |
          cargo build --locked --release --bin vantare-overlays-rune
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $binary = Join-Path $env:CARGO_TARGET_DIR 'release/vantare-overlays-rune.exe'
          $bytes = [IO.File]::ReadAllBytes($binary)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5c)
          if ($subsystem -ne 2) { throw "Release debe ser Windows GUI (2), recibido $subsystem" }
      - name: Compilar GPUI parity-capture, núcleo paint-stats, services y launcher (Release)
        env:
          CARGO_TARGET_DIR: ${{ env.TARGET_MAIN }}
          # Un push no admite inputs de workflow_dispatch. La variable es una entrada pública opcional.
          QA_LICENSE_INPUT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/qa-kit/') && vars.qa_license_public_key || '' }}
        run: |
          Remove-Item Env:VANTARE_LICENSE_PUBLIC_KEYS -ErrorAction SilentlyContinue
          $coreFeatures = 'paint-stats'
          $keyId = ''
          $registryHash = ''
          if ($env:QA_LICENSE_INPUT) {
            if ($env:GITHUB_EVENT_NAME -cne 'push' -or -not $env:GITHUB_REF.StartsWith('refs/heads/qa-kit/', [StringComparison]::Ordinal)) {
              throw 'La clave pública QA solo se admite en push a qa-kit/**'
            }
            if ($env:QA_LICENSE_INPUT -cnotmatch '\Aqa-[0-9a-f]{8}:[A-Za-z0-9_-]{43}\z') {
              throw 'La entrada debe ser una sola clave pública que produzca vantare-qa-license'
            }
            $keyId, $encodedKey = $env:QA_LICENSE_INPUT.Split(':', 2)
            $publicBytes = [Convert]::FromBase64String($encodedKey.Replace('-', '+').Replace('_', '/') + '=')
            $canonicalKey = [Convert]::ToBase64String($publicBytes).TrimEnd('=').Replace('+', '-').Replace('/', '_')
            $publicDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($publicBytes)).ToLowerInvariant()
            if ($publicBytes.Length -ne 32 -or $encodedKey -cne $canonicalKey -or $keyId -cne ('qa-' + $publicDigest.Substring(0,8))) {
              throw 'El key_id QA no corresponde a la entrada pública'
            }
            $registryHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
              [Text.Encoding]::ASCII.GetBytes($env:QA_LICENSE_INPUT))).ToLowerInvariant()
            $coreFeatures += ',qa-license'
          }
          $out = Join-Path $env:RUNNER_TEMP 'qa-kit/bin'
          New-Item -ItemType Directory -Force $out | Out-Null
          $steps = @(
            @{ package='vantare-ui'; bin='vantare-overlays'; features='parity-capture' },
            @{ package='vantare-runtime'; bin='vantare-core'; features=$coreFeatures },
            @{ package='vantare-services'; bin='vantare-services'; features='' },
            @{ package='vantare-runtime'; bin='vantare'; features='' }
          )
          $steps += @{ package='vantare-runtime'; bin='vantare-qa-license'; features='qa-license' }
          foreach ($s in $steps) {
            $cargoArgs = @('build','--manifest-path','vantare-v2/native/Cargo.toml','--locked','--release','-p',$s.package,'--bin',$s.bin)
            if ($s.features) { $cargoArgs += @('--features',$s.features) }
            try {
              if ($keyId -and $s.bin -in @('vantare-core','vantare-qa-license')) {
                $env:VANTARE_LICENSE_PUBLIC_KEYS = $env:QA_LICENSE_INPUT
              }
              cargo @cargoArgs
              if ($LASTEXITCODE) { throw "Build $($s.bin) falló" }
            } finally {
              Remove-Item Env:VANTARE_LICENSE_PUBLIC_KEYS -ErrorAction SilentlyContinue
            }
            # El cargo test posterior puede reconstruir los binarios con otras features.
            $destination = $out
            if ($s.bin -eq 'vantare-qa-license' -and -not $keyId) {
              # Separate bootstrap artifact for the native keygen; never in a visual kit.
              $destination = Join-Path $env:RUNNER_TEMP 'qa-license-bootstrap'
              New-Item -ItemType Directory -Force $destination | Out-Null
            }
            Copy-Item (Join-Path $env:CARGO_TARGET_DIR "release/$($s.bin).exe") $destination
          }
          "QA_KIT_CORE_FEATURES=$coreFeatures" >> $env:GITHUB_ENV
          "QA_KIT_KEY_ID=$keyId" >> $env:GITHUB_ENV
          "QA_KIT_REGISTRY_SHA256=$registryHash" >> $env:GITHUB_ENV
      - name: Arnés de lifecycle (compilado, sin ejecutar)
        env:
          CARGO_TARGET_DIR: ${{ env.TARGET_MAIN }}
        run: |
          cargo test --manifest-path vantare-v2/native/Cargo.toml --locked --release -p vantare-runtime --test lifecycle --no-run
          if ($LASTEXITCODE) { throw 'Arnés de lifecycle falló' }
      - name: Reunir con hashes
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'qa-kit'
          New-Item -ItemType Directory -Force "$out/bin" | Out-Null
          Copy-Item (Join-Path $env:TARGET_RUNE 'release/vantare-overlays-rune.exe') "$out/bin/vantare-overlays-rune.exe"
          $lifecycle = Get-ChildItem (Join-Path $env:TARGET_MAIN 'release/deps') -Filter 'lifecycle-*.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $lifecycle.FullName "$out/bin/lifecycle.exe"
          $rows = Get-ChildItem "$out/bin" -File | Sort-Object Name | ForEach-Object {
            [ordered]@{ file=$_.Name; size=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $measurement = $env:QA_KIT_CORE_FEATURES -ceq 'paint-stats,qa-license'
          $cli = @($rows | Where-Object file -ceq 'vantare-qa-license.exe')
          if ($cli.Count -ne [int]$measurement -or [bool]$env:QA_KIT_KEY_ID -ne $measurement -or
              [bool]$env:QA_KIT_REGISTRY_SHA256 -ne $measurement) {
            throw 'Inventario o procedencia de licencia no corresponde al modo del kit'
          }
          [ordered]@{
            source_sha=$env:GITHUB_SHA
            run_id=$env:GITHUB_RUN_ID
            profile='release opt=3 debug=0 lto=false codegen-units=16'
            core_features=@($env:QA_KIT_CORE_FEATURES.Split(','))
            license_public_keys_configured=$measurement
            license_key_id=if ($measurement) { $env:QA_KIT_KEY_ID } else { $null }
            license_registry_sha256=if ($measurement) { $env:QA_KIT_REGISTRY_SHA256 } else { $null }
            qa_license_cli_sha256=if ($measurement) { $cli[0].sha256 } else { $null }
            files=$rows
          } |
            ConvertTo-Json -Depth 5 | Set-Content "$out/binarios.json" -Encoding utf8
      - name: Recibo del CLI de arranque
        if: env.QA_KIT_CORE_FEATURES == 'paint-stats'
        run: |
          $bootstrap = Join-Path $env:RUNNER_TEMP 'qa-license-bootstrap'
          $cli = Join-Path $bootstrap 'vantare-qa-license.exe'
          [ordered]@{
            source_sha=$env:GITHUB_SHA
            run_id=$env:GITHUB_RUN_ID
            sha256=(Get-FileHash -LiteralPath $cli -Algorithm SHA256).Hash.ToLowerInvariant()
            features=@('qa-license')
          } | ConvertTo-Json | Set-Content (Join-Path $bootstrap 'cli.json') -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.QA_KIT_CORE_FEATURES == 'paint-stats'
        with:
          name: qa-license-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/qa-license-bootstrap
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-kit-${{ github.sha }}
          path: ${{ runner.temp }}/qa-kit
          if-no-files-found: error
          retention-days: 5
