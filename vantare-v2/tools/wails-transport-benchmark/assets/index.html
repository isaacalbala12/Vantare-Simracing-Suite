<!doctype html><html lang="es"><meta charset="utf-8"><title>Vantare Transport Benchmark</title>
<body style="font:16px system-ui;padding:24px"><h1>Comparación de transporte</h1><p id="status">Iniciando...</p>
<script type="module">
import { JSONStream } from "/wails/runtime.js";
const status=document.getElementById("status");
const socketURL=new URL(location.href).searchParams.get("socket");
const cases=[["socket",8192],["stream",8192],["stream",65536],["socket",65536],["socket",8192],["stream",8192]];
const stamp=()=>performance.now();
function runSocket(size){return new Promise((resolve,reject)=>{
 const socket=new WebSocket(socketURL);let expected=1,sent=0,latencies=[];
 socket.onopen=()=>{sent=stamp();socket.send(JSON.stringify({ack:0,size}))};
 socket.onmessage=event=>{let data=JSON.parse(event.data);if(data.sequence!==expected||data.payload.length!==size){reject(new Error("socket frame mismatch"));socket.close();return}latencies.push(stamp()-sent);let ack={ack:expected};if(expected===120)ack.latencies=latencies;sent=stamp();socket.send(JSON.stringify(ack));expected++;if(expected===121){setTimeout(()=>socket.close(),150);resolve()}};
 socket.onerror=()=>reject(new Error("socket error"));socket.onclose=()=>{if(expected!==121)reject(new Error("socket closed early"))};
})}
function runStream(size){return new Promise((resolve,reject)=>{
 const stream=JSONStream("benchmark");let expected=1,sent=0,latencies=[];
 stream.onopen=()=>{sent=stamp();stream.send({ack:0,size})};
 stream.onmessage=({data})=>{if(data.sequence!==expected||data.payload.length!==size){reject(new Error("stream frame mismatch"));stream.close();return}latencies.push(stamp()-sent);let ack={ack:expected};if(expected===120)ack.latencies=latencies;sent=stamp();stream.send(ack);expected++;if(expected===121){setTimeout(()=>stream.close(),150);resolve()}};
 stream.onerror=()=>reject(new Error("stream error"));stream.onclose=()=>{if(expected!==121)reject(new Error("stream closed early"))};
})}
try {for(let i=0;i<cases.length;i++){let [mode,size]=cases[i];status.textContent=`Prueba ${i+1}/${cases.length}: ${mode} ${size/1024} KiB`;await(mode==="socket"?runSocket(size):runStream(size));await new Promise(r=>setTimeout(r,250))}status.textContent="Prueba completada"}catch(error){status.textContent=String(error);console.error(error)}
</script></body></html>
