[package]
name = "vantare-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Fixture compartida solo para pruebas de consumidores; inactiva en producto.
test-support = []

[dependencies]
vantare-profiling.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vantare-domain.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

# Ya transitiva en Cargo.lock: credenciales del par, poll cancelable y flock.
# std no ofrece PID/imagen del par Unix en su API estable.
[target."cfg(unix)".dependencies]
libc = "0.2"
