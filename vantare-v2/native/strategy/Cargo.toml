[package]
name = "vantare-strategy"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Autonomous until the orchestrator connects the owned workspace manifests.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"

[dev-dependencies]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
must_use_candidate = "allow"
