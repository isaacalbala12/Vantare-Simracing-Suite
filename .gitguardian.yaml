# Configuración local de ggshield. La app de GitGuardian gestiona sus propias
# exclusiones/incidentes en el panel; esta lista no acredita un check remoto verde.
# Solo silencia los dos ficheros de fixtures de triaje señalados en el issue
# #1652 (seis alertas heredadas de #1602, valores sintéticos de prueba). No
# cubre ningún otro fichero: un secreto real en cualquier otro sitio sigue
# alertando. Si algún día se tocan estos ficheros, revisar esta lista.
# Formato: https://github.com/GitGuardian/ggshield (doc/schemas y
# `rust/config/src/user_config.rs`: claves `secret.ignored_paths`).
version: 2

secret:
  ignored_paths:
    - 'tools/triage/test_review_1602.py'
    - 'vantare-v2/native/services/src/triage/tests.rs'

# #1636 CI: incidentes 38177715 (PostgreSQL) y 38177716 (Basic Auth), ambos
# fixtures sintéticos de #1602/#1652. Se construyen en ejecución en esas rutas
# exactas, conservando las pruebas de redacción. Sin nuevas exclusiones.
# https://docs.gitguardian.com/ggshield-docs/configuration
# https://docs.gitguardian.com/ggshield-docs/reference/secret/ignore
