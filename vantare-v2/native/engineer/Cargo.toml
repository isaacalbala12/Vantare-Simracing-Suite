[package]
name = "vantare-engineer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vantare-domain.workspace = true
vantare-ipc.workspace = true
# Flows y cierre del proceso; no lee adaptadores ni Core.
vantare-runtime = { path = "../runtime" }
serde_json = "1"

# WinMM para clips locales WAV: ya está en el lock del padre. Sin decoder,
# motor TTS, proceso PowerShell ni servicio de red.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio"] }

[lints]
workspace = true
