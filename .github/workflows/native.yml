# Puertas del workspace Rust nativo (ADR 0099). Solo se dispara si el PR toca
# `vantare-v2/native/**`.
name: native

on:
  pull_request:
    paths:
      - "vantare-v2/native/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vantare-v2/native
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # rust-toolchain.toml fija 1.95.0 con rustfmt y clippy; rustup lo instala solo.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
