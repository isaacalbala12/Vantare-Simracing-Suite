[package]
name = "vantare-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
parity-capture = ["vantare-ui/parity-capture"]

[dependencies]
vantare-ui = { path = "../ui" }
vantare-domain.workspace = true
vantare-ipc.workspace = true
vantare-strategy = { path = "../strategy" }
# Reutiliza la revisión fijada de ui; no introduce una segunda versión de GPUI.
gpui = { git = "https://github.com/zed-industries/zed", rev = "72d28c32c2ba77a579e1c02f984654518552124b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "72d28c32c2ba77a579e1c02f984654518552124b", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ya fijada por services/GPUI; miniaturas locales del contrato IPC.
base64 = "0.22"
# Ya resuelta por GPUI; calendario civil/ventanas UTC, sin parser manual.
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Activa los backends de ventana solo en Linux; Windows mantiene sus rutas GPUI.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "72d28c32c2ba77a579e1c02f984654518552124b", features = ["wayland", "x11"] }

[lints]
workspace = true
