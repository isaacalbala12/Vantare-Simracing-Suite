name: Hub Rune
on:
  push:
    branches: [nightly]
    paths:
      - 'vantare-v2/hub-rune/**'
      - 'vantare-v2/native/hub-host/**'
      - 'vantare-v2/native/ui/assets/fonts/**'
      - 'vantare-v2/hub-web/design/**'
      - 'vantare-v2/hub-web/fixtures/**'
      - 'vantare-v2/hub-web/src/contract/**'
      - 'vantare-v2/hub-web/src/renderer/i18n/**'
      - '.github/workflows/hub-rune.yml'
  pull_request:
    branches: [nightly]
    paths:
      - 'vantare-v2/hub-rune/**'
      - 'vantare-v2/native/hub-host/**'
      - 'vantare-v2/native/ui/assets/fonts/**'
      - 'vantare-v2/hub-web/design/**'
      - 'vantare-v2/hub-web/fixtures/**'
      - 'vantare-v2/hub-web/src/contract/**'
      - 'vantare-v2/hub-web/src/renderer/i18n/**'
      - '.github/workflows/hub-rune.yml'
permissions:
  contents: read
concurrency:
  group: hub-rune-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rune:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: '1.99.1'
    defaults:
      run:
        working-directory: vantare-v2/hub-rune
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure temporary target
        run: '"CARGO_TARGET_DIR=$env:RUNNER_TEMP/hub-rune-target" >> $env:GITHUB_ENV'
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --no-self-update
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: hub-rune-windows-1.99.1-${{ hashFiles('vantare-v2/hub-rune/Cargo.lock') }}
          restore-keys: hub-rune-windows-1.99.1-
      - run: cargo fmt --all -- --check
      - name: Verify dependency policy tests
        run: python scripts/test_dependencies.py
      - name: Reject non-permissive licenses and product runtime/UI dependencies
        run: python scripts/check_dependencies.py
      - name: Check native CI routing
        run: python ../../.github/scripts/test_native_gate_scope.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests without windows or graphics devices
        run: cargo test --locked --all-targets
