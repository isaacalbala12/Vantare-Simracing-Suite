[package]
name = "vantare-hub-rune"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false


[workspace]
resolver = "3"

[[bin]]
name = "vantare-hub-ui-rune"
path = "src/main.rs"

[dependencies]
rune = { default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "svg"], git = "https://github.com/anomalyco/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c" }
vantare-hub-host = { path = "../native/hub-host" }
serde_json = "1"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c" }
winit = { git = "https://github.com/anomalyco/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "d5338988a7c1b3377adb60853815b6d0843dae7c" }

[profile.dev]
debug = 0

[profile.release]
debug = 0

[target.'cfg(windows)'.dependencies]
# Existing host/Rune package, now used directly for bounded private-pipe I/O.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
