name: Hub web
on:
  push:
    branches: [nightly]
    paths: ['vantare-v2/hub-web/**', '.github/workflows/hub-web.yml']
  pull_request:
    branches: [nightly]
    paths: ['vantare-v2/hub-web/**', '.github/workflows/hub-web.yml']
  workflow_dispatch:
concurrency:
  group: hub-web-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vantare-v2/hub-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Typecheck QA and packaging scripts
        run: bun run typecheck:scripts
      - run: bun run lint
      - run: bun run test
      - name: Install Chromium and system dependencies
        run: |
          set -o pipefail
          install_log="$(mktemp)"
          trap 'rm -f "$install_log"' EXIT
          for attempt in 1 2 3; do
            echo "Chromium system dependencies: attempt $attempt/3"
            if timeout --kill-after=10s 180s bun x playwright-core install --with-deps chromium 2>&1 | tee "$install_log"; then
              exit 0
            fi
            if ! grep -Eiq 'Temporary failure resolving|Could not resolve|Could not connect|Failed to connect|Connection timed out|Connection reset by peer|Network is unreachable|EAI_AGAIN|ENOTFOUND|ECONNRESET|ETIMEDOUT' "$install_log"; then
              echo "::error::Chromium installation failed without a recognized network error."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::warning::System dependencies omitted after three network failures; installing Chromium only. Browser tests remain required."
          bun x playwright-core install chromium
      - run: bun run build
      - run: bun scripts/web-a11y.ts
      - run: bun scripts/settings-web.ts
  windows-smoke:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vantare-v2/hub-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run package
      - run: bun run build
        env:
          VANTARE_HUB_QA_BUILD: '1'
      - run: bun run package
        env:
          VANTARE_HUB_QA_BUILD: '1'
      - run: bun run smoke
