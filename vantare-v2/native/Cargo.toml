[workspace]
resolver = "3"
members = ["domain", "runtime", "ipc", "ui", "engineer"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
vantare-domain = { path = "domain" }
vantare-ipc = { path = "ipc" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
# Ruido del modelo (muchos tipos `Snapshot`, `Session`...) sin valor para el lector.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
