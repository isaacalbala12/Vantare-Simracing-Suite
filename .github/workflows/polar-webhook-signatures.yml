name: Polar webhook signatures

on:
  pull_request:
    branches: [nightly]
    paths:
      - 'supabase/functions/_shared/webhook-verify*'
      - 'supabase/functions/billing-webhook/**'
      - 'supabase/functions/clerk-webhook/**'
      - 'supabase/functions/deno.*'
      - '.github/workflows/polar-webhook-signatures.yml'

permissions:
  contents: read

jobs:
  signatures:
    name: Standard and legacy webhook regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: 2.7.13
      - name: Verify independent signatures and commercial processing
        run: |
          deno test --frozen --config supabase/functions/deno.json --allow-env --allow-read \
            supabase/functions/_shared/webhook-verify.test.ts \
            supabase/functions/billing-webhook/ \
            supabase/functions/clerk-webhook/index.test.ts
