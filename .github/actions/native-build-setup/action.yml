name: Native Windows build tools and cache
description: Prebuilt tools, registry cache and compiler cache without duplicate targets
runs:
  using: composite
  steps:
    - name: Configure GitHub compiler cache namespace
      shell: pwsh
      run: |
        "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
        "SCCACHE_GHA_VERSION=vanta137-v1" >> $env:GITHUB_ENV
        "SCCACHE_SERVER_PORT=4227" >> $env:GITHUB_ENV
        "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
        # Installation invokes Cargo from vantare-v2/, above rust-toolchain.toml.
        # Use the same compiler as archive/overlays, independent of runner defaults.
        "RUSTUP_TOOLCHAIN=1.95.0" >> $env:GITHUB_ENV
    - name: Install pinned prebuilt compiler and lint components
      shell: pwsh
      run: |
        rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --no-self-update
        if ($LASTEXITCODE) { throw 'Pinned Rust compiler/components installation failed' }
    - name: Cache Cargo registry and git sources
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-windows-1.95-${{ hashFiles('vantare-v2/native/Cargo.lock') }}
        restore-keys: cargo-windows-1.95-
    - name: Install prebuilt Nextest
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
      with:
        tool: cargo-nextest@0.9.146
        fallback: none
    - name: Enable sccache GitHub backend
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      with:
        version: v0.18.0
    - name: Fetch locked native dependencies
      shell: pwsh
      working-directory: vantare-v2/native
      run: cargo fetch --locked --target x86_64-pc-windows-msvc
    - name: Install verified DuckDB development library
      shell: pwsh
      working-directory: vantare-v2/native
      run: ./setup-duckdb.ps1
