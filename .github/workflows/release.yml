name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_channel:
        description: "Build only, or publish a verified pre-release"
        required: true
        default: none
        type: choice
        options: [none, nightly, testers]
      release_tag:
        description: "Required for pre-release, e.g. v0.1.0.5-nightly.1"
        required: false
        type: string
      release_notes:
        description: "Short, customer-facing summary"
        required: false
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"
  WAILS_VERSION: "v3.0.0-alpha.98-tui"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.1.0"
  NSIS_VERSION: "3.12.0"
  VANTARE_DIR: "vantare-v2"

jobs:
  source:
    name: Validate release channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source ref
        env:
          PUBLISH_CHANNEL: ${{ inputs.publish_channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$GITHUB_REF" in
              refs/heads/nightly|refs/heads/testers) ;;
              *) echo "::error::Internal builds can only run from nightly or testers"; exit 1 ;;
            esac
            if [ "$PUBLISH_CHANNEL" != "none" ]; then
              test "$GITHUB_REF" = "refs/heads/$PUBLISH_CHANNEL" || { echo "::error::Channel and branch must match"; exit 1; }
              test -n "$RELEASE_TAG" || { echo "::error::release_tag is required"; exit 1; }
              echo "$RELEASE_TAG" | grep -Eq "^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-${PUBLISH_CHANNEL}\.[0-9]+$" || {
                echo "::error::Invalid pre-release tag for $PUBLISH_CHANNEL"; exit 1;
              }
            fi
            exit 0
          fi

          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Public releases require a v* tag"; exit 1 ;;
          esac
          git fetch origin master --no-tags
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test -n "$tag_commit" || { echo "::error::Unable to resolve $GITHUB_REF_NAME"; exit 1; }
          git merge-base --is-ancestor "$tag_commit" origin/master || {
            echo "::error::$GITHUB_REF_NAME is not contained in origin/master"
            exit 1
          }

      - name: Verify pre-release Discord destinations
        if: github.event_name == 'workflow_dispatch' && inputs.publish_channel != 'none'
        env:
          DISCORD_PROGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK_URL }}
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_KNOWN_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_KNOWN_ISSUES_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          secret_names = (
              "DISCORD_PROGRESS_WEBHOOK_URL",
              "DISCORD_BUILD_WEBHOOK_URL",
              "DISCORD_RELEASE_WEBHOOK_URL",
              "DISCORD_KNOWN_ISSUES_WEBHOOK_URL",
          )
          # Only the Nightly/Testers route is required: it is the one testers
          # actually receive. The changelog channel has no webhook configured,
          # and requiring it blocked every pre-release. It stays optional here
          # and in the resolve step, so creating that webhook later restores
          # the announcement without touching this workflow.
          required = {
              "Nightly/Testers": "1519752249977340168",
          }
          failed = False
          channels = {}
          for secret_name in secret_names:
              webhook = os.environ.get(secret_name, "")
              if not webhook:
                  print(f"::error::{secret_name} is not configured")
                  failed = True
                  continue
              request = urllib.request.Request(webhook, headers={"User-Agent": "Vantare-GitHub-Actions/1.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  actual = str(json.load(response).get("channel_id", "missing"))
              channels.setdefault(actual, []).append(secret_name)
              print(f"{secret_name}: channel {actual}")
          for label, expected in required.items():
              matches = channels.get(expected, [])
              if len(matches) != 1:
                  print(f"::error::{label} requires exactly one webhook for channel {expected}; found {matches}")
                  failed = True
          if failed:
              raise SystemExit(1)
          PY

  build:
    name: Build Windows release artifacts
    needs: source
    runs-on: windows-latest
    env:
      # Frontend (Vite consumes these at build time)
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Go binary (injected via ldflags at build time). These are the same
      # public values Vite uses; the Go binary needs them to validate OAuth
      # tokens against Supabase at runtime without requiring testers to set
      # environment variables. Runtime env vars still override these.
      VANTARE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VANTARE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Versioned Ed25519 public keys only (key-id:base64url-public-key). The
      # private signing key exists exclusively in the Supabase function env.
      VANTARE_LICENSE_PUBLIC_KEYS: ${{ secrets.VANTARE_LICENSE_PUBLIC_KEYS }}
      # Branch builds identify their actual channel inside the binary. Tagged
      # public builds are always master; the source job already proves the tag
      # belongs to master.
      VANTARE_BUILD_CHANNEL: ${{ github.ref_type == 'branch' && github.ref_name || 'master' }}
    defaults:
      run:
        shell: powershell
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Supabase Env Vars
        run: |
          if (-not $env:VITE_SUPABASE_URL) { throw "Missing VITE_SUPABASE_URL" }
          if (-not $env:VITE_SUPABASE_ANON_KEY) { throw "Missing VITE_SUPABASE_ANON_KEY" }
          if (-not $env:VANTARE_LICENSE_PUBLIC_KEYS) { throw "Missing VANTARE_LICENSE_PUBLIC_KEYS" }

      - name: Gate - Supabase deploy surface
        run: '& "$env:GITHUB_WORKSPACE\supabase\functions\scripts\verify-deploy-surface.ps1"'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.VANTARE_DIR }}/go.mod
          cache-dependency-path: ${{ env.VANTARE_DIR }}/go.sum

      - name: Add Go bin to PATH
        run: echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~\go\bin\wails3.exe
          key: ${{ runner.os }}-wails3-${{ env.WAILS_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NSIS
        run: choco install nsis --version=${{ env.NSIS_VERSION }} --no-progress --yes

      - name: Install Wails v3 CLI
        run: |
          if (-not (Get-Command wails3 -ErrorAction SilentlyContinue)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          } else {
            Write-Host "wails3 already present in PATH"
          }

      - name: Gate - Frontend deps
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm install --frozen-lockfile

      - name: Gate - Frontend build
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm build

      - name: Gate - Go tests
        env:
          INTERNAL_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if ($env:INTERNAL_BUILD -ne "true") {
            go test ./...
            exit $LASTEXITCODE
          }

          $appPackage = "github.com/vantare/overlays/v2/internal/app"
          $otherPackages = @(go list ./... | Where-Object { $_ -ne $appPackage })
          if ($LASTEXITCODE -ne 0) { throw "go list failed" }
          go test @otherPackages
          if ($LASTEXITCODE -ne 0) { throw "Go package tests failed" }
          go test ./internal/app -skip '^TestConcurrentSavesDontCorruptFile$'
          if ($LASTEXITCODE -ne 0) { throw "internal/app tests failed" }

      - name: Gate - ISA-118 concurrent settings save (internal advisory)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: go test ./internal/app -run '^TestConcurrentSavesDontCorruptFile$' -count=1

      - name: Gate - Frontend tests
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        env:
          INTERNAL_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if ($env:INTERNAL_BUILD -ne "true") {
            pnpm test
            exit $LASTEXITCODE
          }

          pnpm exec vitest run `
            --exclude scripts/crystal-reference-manifest.test.mjs `
            --exclude src/hub/calendar/CalendarMonthView.test.tsx `
            --exclude src/hub/overlay-studio/canvas/useCanvasInteraction.test.tsx
          if ($LASTEXITCODE -ne 0) { throw "Blocking frontend tests failed" }

      - name: Gate - ISA-173 Crystal manifest runner (internal advisory)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm exec vitest run scripts/crystal-reference-manifest.test.mjs

      - name: Gate - ISA-174 Calendar month boundary (internal advisory)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm exec vitest run src/hub/calendar/CalendarMonthView.test.tsx

      - name: Gate - ISA-172 canvas interaction flake (internal advisory)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm exec vitest run src/hub/overlay-studio/canvas/useCanvasInteraction.test.tsx

      - name: Gate - Frontend lint
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm lint

      - name: Build release artifacts
        run: |
          wails3 task release:clean
          wails3 task release:artifacts
          wails3 task release:verify

      - name: Verify artifact set
        run: |
          $files = @(
            "bin/vantare.exe",
            "bin/vantare.exe.sha256",
            "bin/vantare-amd64-installer.exe",
            "bin/vantare-amd64-installer.exe.sha256",
            "bin/vantare-portable-amd64.zip",
            "bin/vantare-portable-amd64.zip.sha256"
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing artifact: $f" }
          }
          Write-Host "All 6 official artifacts present."

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.run_id }}
          path: |
            ${{ env.VANTARE_DIR }}/bin/vantare.exe
            ${{ env.VANTARE_DIR }}/bin/vantare.exe.sha256
            ${{ env.VANTARE_DIR }}/bin/vantare-amd64-installer.exe
            ${{ env.VANTARE_DIR }}/bin/vantare-amd64-installer.exe.sha256
            ${{ env.VANTARE_DIR }}/bin/vantare-portable-amd64.zip
            ${{ env.VANTARE_DIR }}/bin/vantare-portable-amd64.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_channel != 'none')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify release contract
        id: contract
        shell: bash
        env:
          PUBLISH_CHANNEL: ${{ inputs.publish_channel }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            prerelease=true
          else
            tag="$GITHUB_REF_NAME"
            prerelease=false
            git fetch origin master --no-tags
            tag_commit="$(git rev-list -n 1 "$tag")"
            test -n "$tag_commit" || { echo "::error::Unable to resolve $tag"; exit 1; }
            git merge-base --is-ancestor "$tag_commit" origin/master || { echo "::error::$tag is not contained in origin/master"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.run_id }}
          path: ${{ env.VANTARE_DIR }}/bin

      - name: Extract changelog section
        id: changelog
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          TAG="${{ steps.contract.outputs.tag }}"
          export TAG NOTES
          python3 - <<PY
          import os
          import re
          import sys

          tag = os.environ.get("TAG", "")
          changelog_path = "vantare-v2/docs/changelog.md"
          fallback = os.environ.get("NOTES", "").strip() or f"Release {tag}"
          body = fallback

          if os.path.exists(changelog_path):
              with open(changelog_path, "r", encoding="utf-8") as fh:
                  changelog = fh.read()
              pattern = re.compile(
                  rf"^##\s+{re.escape(tag)}\s*$([\s\S]*?)(?=^##\s+v|\Z)",
                  re.MULTILINE,
              )
              match = pattern.search(changelog)
              if match:
                  section = match.group(1).strip()
                  if section:
                      body = section
                  else:
                      print(f"::warning::Changelog section for {tag} is empty")
              else:
                  print(f"::warning::Could not find changelog section for {tag}")
          else:
              print(f"::warning::Changelog not found at {changelog_path}")

          with open("changelog_body.md", "w", encoding="utf-8") as fh:
              fh.write(body)

          output_path = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(output_path, "a", encoding="utf-8") as fh:
              fh.write("body<<EOF\n")
              fh.write(body)
              fh.write("\nEOF\n")
          PY

      - name: Create or update GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.contract.outputs.tag }}"
          PRERELEASE="${{ steps.contract.outputs.prerelease }}"
          BIN_DIR="${{ env.VANTARE_DIR }}/bin"
          ASSETS=(
            "$BIN_DIR/vantare.exe"
            "$BIN_DIR/vantare.exe.sha256"
            "$BIN_DIR/vantare-amd64-installer.exe"
            "$BIN_DIR/vantare-amd64-installer.exe.sha256"
            "$BIN_DIR/vantare-portable-amd64.zip"
            "$BIN_DIR/vantare-portable-amd64.zip.sha256"
          )
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing expected asset: $asset"
              exit 1
            fi
          done

          echo "Checking if GitHub Release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing notes and re-uploading the 6 official assets with --clobber."
            gh release edit "$TAG" \
              --title "Vantare $TAG" \
              --notes-file changelog_body.md \
              $([ "$PRERELEASE" = "true" ] && echo --prerelease || echo --latest)
            for asset in "${ASSETS[@]}"; do
              echo "Uploading (clobber) $asset"
              gh release upload "$TAG" "$asset" --clobber
            done
          else
            echo "Release $TAG does not exist; creating it with the 6 official assets."
            gh release create "$TAG" \
              --title "Vantare $TAG" \
              --notes-file changelog_body.md \
              --target "$GITHUB_SHA" \
              $([ "$PRERELEASE" = "true" ] && echo --prerelease || echo --latest) \
              "${ASSETS[@]}"
          fi

          echo "Final release state for $TAG:"
          gh release view "$TAG" --json tagName,name,assets --jq '.tagName + " assets=" + (.assets | length | tostring)'

      - name: Resolve verified announcement metadata
        if: steps.contract.outputs.prerelease == 'true'
        id: announce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.contract.outputs.tag }}
        run: |
          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          download_url="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/vantare-amd64-installer.exe"
          sha256="$(awk '{print $1}' '${{ env.VANTARE_DIR }}/bin/vantare-amd64-installer.exe.sha256')"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Build accessible Discord payloads and HTML
        if: steps.contract.outputs.prerelease == 'true'
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          manifest="vantare-v2/docs/releases/${{ steps.contract.outputs.tag }}.json"
          test -f "$manifest" || { echo "::error::Missing canonical release manifest: $manifest"; exit 1; }
          mapfile -t files < <(python - "$manifest" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for issue in manifest["issues"]:
              print(f"vantare-v2/docs/changelog/fragments/{issue}.json")
          PY
          )
          args=(); for file in "${files[@]}"; do args+=(--fragment "$file"); done
          python .github/scripts/discord_communications.py "${{ inputs.publish_channel }}" --dry-run --revision "$GITHUB_SHA" \
            --html-output "$RUNNER_TEMP/vantare-channel.html" "${args[@]}" > "$RUNNER_TEMP/channel.json"
          python .github/scripts/discord_communications.py build --dry-run --channel "${{ inputs.publish_channel }}" \
            --version "${{ steps.contract.outputs.tag }}" --notes "$NOTES" \
            --download-url "${{ steps.announce.outputs.download_url }}" --sha256 "${{ steps.announce.outputs.sha256 }}" \
            --release-url "${{ steps.announce.outputs.release_url }}" \
            --known-issues-url "${{ github.server_url }}/${{ github.repository }}/blob/master/vantare-v2/docs/tester-known-issues.md" \
            --html-output "$RUNNER_TEMP/vantare-changelog.html" > "$RUNNER_TEMP/changelog.json"

      - name: Render Discord cards
        if: steps.contract.outputs.prerelease == 'true'
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1200,630 \
            --screenshot="$RUNNER_TEMP/vantare-${{ inputs.publish_channel }}.png" "file://$RUNNER_TEMP/vantare-channel.html"
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1200,630 \
            --screenshot="$RUNNER_TEMP/vantare-changelog.png" "file://$RUNNER_TEMP/vantare-changelog.html"
          test -s "$RUNNER_TEMP/vantare-${{ inputs.publish_channel }}.png"
          test -s "$RUNNER_TEMP/vantare-changelog.png"

      - name: Resolve pre-release Discord routes by channel ID
        if: steps.contract.outputs.prerelease == 'true'
        env:
          DISCORD_PROGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK_URL }}
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_KNOWN_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_KNOWN_ISSUES_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          names = (
              "DISCORD_PROGRESS_WEBHOOK_URL", "DISCORD_BUILD_WEBHOOK_URL",
              "DISCORD_RELEASE_WEBHOOK_URL", "DISCORD_KNOWN_ISSUES_WEBHOOK_URL",
          )
          # The tester route must resolve; the changelog one is written only if
          # a webhook uniquely matches its channel, and its absence leaves the
          # variable unset for the publish step to skip.
          targets = {"VANTARE_TESTER_WEBHOOK": "1519752249977340168"}
          optional = {"VANTARE_CHANGELOG_WEBHOOK": "1519747444315914512"}
          by_channel = {}
          for name in names:
              value = os.environ.get(name, "")
              if not value:
                  continue
              request = urllib.request.Request(value, headers={"User-Agent": "Vantare-GitHub-Actions/1.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  channel = str(json.load(response).get("channel_id", ""))
              by_channel.setdefault(channel, []).append(value)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output_file:
              for output, channel in targets.items():
                  matches = by_channel.get(channel, [])
                  if len(matches) != 1:
                      raise SystemExit(f"Unable to resolve unique webhook for {channel}")
                  output_file.write(f"{output}={matches[0]}\n")
              for output, channel in optional.items():
                  matches = by_channel.get(channel, [])
                  if len(matches) == 1:
                      output_file.write(f"{output}={matches[0]}\n")
                  else:
                      print(f"::notice::No unique webhook for channel {channel}; skipping {output}")
          PY

      - name: Publish Nightly/Testers and changelog after verified release
        if: steps.contract.outputs.prerelease == 'true'
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          manifest="vantare-v2/docs/releases/${{ steps.contract.outputs.tag }}.json"
          mapfile -t files < <(python - "$manifest" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for issue in manifest["issues"]:
              print(f"vantare-v2/docs/changelog/fragments/{issue}.json")
          PY
          )
          args=(); for file in "${files[@]}"; do args+=(--fragment "$file"); done
          DISCORD_PROGRESS_WEBHOOK_URL="$VANTARE_TESTER_WEBHOOK" \
          python .github/scripts/discord_communications.py "${{ inputs.publish_channel }}" --revision "$GITHUB_SHA" \
            --image "$RUNNER_TEMP/vantare-${{ inputs.publish_channel }}.png" "${args[@]}"
          # The changelog channel is optional. Posting it to whatever webhook
          # happened to be configured would put the card in the wrong channel,
          # so with no route resolved the card is simply not published.
          if [ -n "${VANTARE_CHANGELOG_WEBHOOK:-}" ]; then
            DISCORD_BUILD_WEBHOOK_URL="$VANTARE_CHANGELOG_WEBHOOK" \
            python .github/scripts/discord_communications.py build --channel "${{ inputs.publish_channel }}" \
              --version "${{ steps.contract.outputs.tag }}" --notes "$NOTES" \
              --download-url "${{ steps.announce.outputs.download_url }}" --sha256 "${{ steps.announce.outputs.sha256 }}" \
              --release-url "${{ steps.announce.outputs.release_url }}" \
              --known-issues-url "${{ github.server_url }}/${{ github.repository }}/blob/master/vantare-v2/docs/tester-known-issues.md" \
              --image "$RUNNER_TEMP/vantare-changelog.png"
          else
            echo "::notice::No changelog webhook resolved; skipping the changelog card"
          fi

      - name: Build stable release card
        if: steps.contract.outputs.prerelease != 'true'
        run: |
          python .github/scripts/discord_communications.py release --dry-run \
            --tag "${{ steps.contract.outputs.tag }}" --section-file changelog_body.md \
            --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.contract.outputs.tag }}" \
            --revision "$GITHUB_SHA" --html-output "$RUNNER_TEMP/vantare-release.html"
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1200,630 \
            --screenshot="$RUNNER_TEMP/vantare-release.png" "file://$RUNNER_TEMP/vantare-release.html"
          test -s "$RUNNER_TEMP/vantare-release.png"

      - name: Publish stable release after verified assets
        if: steps.contract.outputs.prerelease != 'true'
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ vars.DISCORD_RELEASE_CHANNEL_ID }}
        run: |
          python .github/scripts/discord_communications.py release \
            --tag "${{ steps.contract.outputs.tag }}" --section-file changelog_body.md \
            --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.contract.outputs.tag }}" \
            --revision "$GITHUB_SHA" --image "$RUNNER_TEMP/vantare-release.png"
