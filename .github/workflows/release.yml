# ISA-1533: Wails publication is retired. Native packaging has a separate,
# explicitly authorized manual pipeline in vantare-v2/native/packaging.
name: Release build
on:
  workflow_dispatch:
    inputs:
      publish_channel:
        type: choice
        options: [none]
        default: none
      release_tag:
        type: string
      release_notes:
        type: string
      source_sha:
        type: string
        required: true
  workflow_call:
    inputs:
      publish_channel:
        type: string
        required: true
      release_tag:
        type: string
        required: true
      release_notes:
        type: string
        required: true
      source_sha:
        type: string
        required: true
    outputs:
      release_tag:
        value: ${{ jobs.release.outputs.release_tag }}
      release_source_sha:
        value: ${{ jobs.release.outputs.release_source_sha }}
      release_asset_count:
        value: ${{ jobs.release.outputs.release_asset_count }}
      checksums_verified:
        value: ${{ jobs.release.outputs.checksums_verified }}
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ''
      release_source_sha: ''
      release_asset_count: ''
      checksums_verified: ''
    steps:
      - name: Reject retired release pipeline
        run: |
          echo "::error::Wails release retired; no release is enabled by ISA-1533"
          exit 1
