name: Branch channel gates

on:
  push:
    branches: [nightly, testers]
  pull_request:
    branches: [nightly, testers, master]

permissions:
  contents: read

concurrency:
  group: branch-channel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.1.0"
  VANTARE_DIR: "vantare-v2"

jobs:
  policy:
    name: Validate promotion path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch topology
        run: |
          python .github/scripts/validate_branch_channels.py \
            --event "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --base "${{ github.base_ref }}" \
            --head "${{ github.head_ref }}"

      - name: Test branch topology policy
        run: python .github/scripts/test_validate_branch_channels.py

  product:
    name: Validate Vantare blocking gates
    needs: policy
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: ${{ env.VANTARE_DIR }}
    env:
      VITE_INCLUDE_OVERLAY_WORKSHOP: ${{ (github.base_ref == 'nightly' || github.base_ref == 'testers' || github.ref == 'refs/heads/nightly' || github.ref == 'refs/heads/testers') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.VANTARE_DIR }}/go.mod
          cache-dependency-path: ${{ env.VANTARE_DIR }}/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm build

      - name: Verify Overlay Workshop channel bundle
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: |
          $expected = if ($env:VITE_INCLUDE_OVERLAY_WORKSHOP -eq "true") { "internal" } else { "stable" }
          pnpm verify:overlay-workshop-bundle -- --dist dist --expect $expected

      - name: Go tests (blocking except isolated ISA-118)
        run: |
          $appPackage = "github.com/vantare/overlays/v2/internal/app"
          $otherPackages = @(go list ./... | Where-Object { $_ -ne $appPackage })
          if ($LASTEXITCODE -ne 0) { throw "go list failed" }
          go test @otherPackages
          if ($LASTEXITCODE -ne 0) { throw "Go package tests failed" }
          go test ./internal/app -skip '^TestConcurrentSavesDontCorruptFile$'
          if ($LASTEXITCODE -ne 0) { throw "internal/app tests failed" }

      - name: ISA-118 concurrent settings save (advisory until deterministic)
        continue-on-error: true
        run: go test ./internal/app -run '^TestConcurrentSavesDontCorruptFile$' -count=1

      - name: Frontend tests (blocking except exact registered debt)
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: >-
          pnpm exec vitest run
          --exclude scripts/crystal-reference-manifest.test.mjs
          --exclude src/hub/calendar/CalendarMonthView.test.tsx
          --exclude src/hub/overlay-studio/canvas/useCanvasInteraction.test.tsx

      - name: ISA-173 Crystal manifest runner (advisory)
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm exec vitest run scripts/crystal-reference-manifest.test.mjs

      - name: ISA-174 Calendar month boundary (advisory)
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm exec vitest run src/hub/calendar/CalendarMonthView.test.tsx

      - name: ISA-172 canvas interaction flake (advisory)
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm exec vitest run src/hub/overlay-studio/canvas/useCanvasInteraction.test.tsx

      - name: Frontend lint (advisory while inherited debt is isolated)
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm lint
