[package]
name = "vantare-services"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Workspace aislado dentro de las rutas del worker. Opus integra los manifests
# del workspace/Hub; no se modifica la configuración de otros workers.
[workspace]

[features]
default = ["network"]
network = ["dep:ureq", "dep:url", "dep:vantare-ipc"]

[[bin]]
name = "vantare-services"
path = "src/bin/vantare-services.rs"
required-features = ["network"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
vantare-ipc = { path = "../ipc", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
url = { version = "2", features = ["serde"], optional = true }
sha2 = "0.10"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
