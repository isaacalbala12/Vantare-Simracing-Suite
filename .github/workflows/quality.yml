name: vantare-quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vantare-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-check:
    name: quality-check (ratchet)
    if: '!github.event.repository.private || github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","vantare-1565"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check retired scope and retained evidence
        run: python3 tools/quality/vantare_quality.py check --ci --base "${{ github.event.pull_request.base.sha || github.sha }}"
      - name: Test integrity and ratchet
        run: python3 -m unittest discover -s tools/quality/tests

  native-linux:
    name: native-linux
    if: '!github.event.repository.private || github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","vantare-1565"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vantare-v2/native
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install native Linux dependencies
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake pkg-config libasound2-dev \
            libfontconfig-dev libgit2-dev libglib2.0-dev libssl-dev libva-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libzstd-dev

      - name: Verify pinned Rust toolchain
        run: rustup show active-toolchain

      # Caché de los artefactos de *dependencias* (rust-cache borra antes de
      # guardar los crates del workspace y el fork vendorizado, y limpia el
      # incremental). Incluye el registro y el clon git de Cargo (~1 GB, zed
      # 388 MB): sustituye a la caché `cargo-registry` de la ronda 1. Aquí el
      # target es el de por defecto (native/target). Clave por rustc +
      # Cargo.lock/Cargo.toml: no cambia por PR; si cambia el lock, restaura la
      # entrada anterior. Aviso: este flujo solo corre en pull_request, así que
      # su cache queda en el merge ref y solo lo reutilizan las ejecuciones del
      # mismo PR (nightly no lo guarda).
      - name: Cache de artefactos de dependencias (target)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            vantare-v2/native -> target
          shared-key: native-linux
          # El binario de nextest se cachea aparte: no guardar ~/.cargo/bin dos veces.
          cache-bin: "false"

      # Igual que en Windows (setup-duckdb.ps1 + gates.ps1, #1465): enlaza la
      # biblioteca oficial 1.5.5 en vez de compilar el C++ de DuckDB bundled
      # (~9 min del gate check). La lista de features se calcula como en
      # gates.ps1: --no-default-features + el default de cada miembro salvo
      # storage, y falla si el default de storage cambia. Los tests siguen
      # ejecutándose completos. NATIVE_FEATURE_ARGS va sin comillas a propósito
      # (0 o 2 argumentos).
      - name: Prepare prebuilt DuckDB (sin compilar C++)
        run: |
          set -euo pipefail
          features="$(python3 - <<'PY'
          import json, subprocess
          meta = json.loads(subprocess.run(["cargo", "metadata", "--locked", "--offline", "--no-deps", "--format-version", "1"], check=True, capture_output=True, text=True).stdout)
          members = [p for p in meta["packages"] if p["id"] in set(meta["workspace_members"])]
          storage = [p for p in members if p["name"] == "vantare-storage"]
          assert len(storage) == 1 and storage[0]["features"].get("default") == ["bundled-duckdb"], "El default de storage cambio: revisar este paso antes de desactivar bundled-duckdb."
          feats = sorted(p["name"] + "/default" for p in members if p["name"] != "vantare-storage" and "default" in p["features"])
          print(",".join(feats))
          PY
          )"
          args=""
          if [ -n "$features" ]; then args="--no-default-features --features $features"; fi
          echo "NATIVE_FEATURE_ARGS=$args" >> "$GITHUB_ENV"
          duckdb_dir="$RUNNER_TEMP/duckdb-1.5.5"
          mkdir -p "$duckdb_dir"
          archive="$duckdb_dir/libduckdb-linux-amd64.zip"
          curl -fsSL -o "$archive" \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip
          echo "1fb8ce388157d84a25abe685a8a2520bf00c00321821968e4bb398fd766e7abb  $archive" | sha256sum --check --status -
          unzip -o "$archive" libduckdb.so -d "$duckdb_dir"
          rm -f "$archive"
          test -f "$duckdb_dir/libduckdb.so"
          echo "DUCKDB_LIB_DIR=$duckdb_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$duckdb_dir" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check all workspace targets
        run: cargo check --workspace --all-targets --locked $NATIVE_FEATURE_ARGS -j 2

      - name: Clippy all workspace targets
        run: cargo clippy --workspace --all-targets --locked $NATIVE_FEATURE_ARGS -j 2 -- -D warnings

      # El binario solo cambia al subir la versión: se guarda en caché y se
      # evita recompilarlo (342–430 s por trabajo en Windows; 174–226 s aquí).
      - name: Cache de cargo-nextest
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-0.9.146-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned Nextest
        run: |
          have=""
          if command -v cargo-nextest >/dev/null 2>&1; then
            have="$(cargo nextest --version 2>/dev/null || true)"
          fi
          if [ "$have" = "cargo-nextest 0.9.146" ]; then
            echo 'cargo-nextest 0.9.146 ya disponible: no se instala'
          else
            cargo install cargo-nextest --locked --version 0.9.146
          fi

      - name: Test workspace
        env:
          NEXTEST_TEST_THREADS: '1'
        run: cargo nextest run --workspace --locked $NATIVE_FEATURE_ARGS -j 2

      - name: Test real telemetry corpus
        env:
          NEXTEST_TEST_THREADS: '1'
        run: cargo nextest run --workspace --locked $NATIVE_FEATURE_ARGS -j 2 --profile telemetria

      - name: Test lifecycle targets
        run: cargo test --workspace --test lifecycle --locked $NATIVE_FEATURE_ARGS -j 2
