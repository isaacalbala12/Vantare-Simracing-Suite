name: Branch channel gates

on:
  push:
    branches: [nightly, testers]
  pull_request:
    branches: [nightly, testers, master]
  merge_group:
    branches: [nightly]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: branch-channel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.1.0"
  WAILS_VERSION: "v3.0.0-alpha.98-tui"
  VANTARE_DIR: "vantare-v2"

jobs:
  policy:
    name: Validate promotion path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check branch topology
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BASE: ${{ github.base_ref }}
          EVENT_HEAD: ${{ github.head_ref }}
        run: |
          python .github/scripts/validate_branch_channels.py \
            --event "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --base "$EVENT_BASE" \
            --head "$EVENT_HEAD"

      - name: Test branch topology policy
        run: python .github/scripts/test_validate_branch_channels.py

      - name: Test Testing Center deterministic diff gate
        run: python .github/scripts/test_testing_center_diff_gate.py

      - name: Test Testing Center trusted manifest collector
        run: python .github/scripts/test_testing_center_manifest_collector.py
      - name: Test Testing Center changed lint scope
        run: python .github/scripts/test_testing_center_changed_lint.py

      - name: Test inert Testing Center merge queue policy
        run: python .github/scripts/test_testing_center_merge_queue.py

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: 2.7.13

      - name: Test Testing Center agent workflow contract
        run: deno test --no-lock --allow-read=.github/workflows,.github/agents,supabase/tests/testing-center-agent-workflow-contract.test.ts supabase/tests/testing-center-agent-workflow-contract.test.ts

  product:
    name: Validate Vantare blocking gates
    needs: policy
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: ${{ env.VANTARE_DIR }}/go.mod
          cache-dependency-path: ${{ env.VANTARE_DIR }}/go.sum

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Classify changed scope
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          ENFORCE_TESTING_CENTER_SCOPE: ${{ startsWith(github.head_ref, 'vantareapp/tc-') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGED_SCOPE_PATH: ${{ runner.temp }}/testing-center-changed-scope.json
        run: |
          set -euo pipefail
          test "$BASE_SHA" != "0000000000000000000000000000000000000000"
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths.bin"
          scope_args=()
          if [ "$ENFORCE_TESTING_CENTER_SCOPE" = "true" ]; then
            scope_args+=(--enforce-testing-center-scope)
          fi
          python .github/scripts/testing_center_changed_lint.py \
            --nul-file "$RUNNER_TEMP/changed-paths.bin" \
            --output "$CHANGED_SCOPE_PATH" \
            "${scope_args[@]}"

      - name: Add Go bin to PATH
        run: echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm build

      # ISA-118, ISA-172, ISA-173 and ISA-174 used to be carved out of these two
      # runs and repeated as advisory steps, which painted the gate red on every
      # pass. Their causes are fixed, so they are back inside the blocking runs.
      - name: Go tests
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed" }

      - name: Frontend tests
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm exec vitest run

      - name: Changed frontend lint
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: |
          $scope = Get-Content "$env:RUNNER_TEMP/testing-center-changed-scope.json" -Raw | ConvertFrom-Json
          if (-not $scope.eligible) { throw "automatic scope is not eligible" }
          $paths = @($scope.lint_paths | ForEach-Object { $_.Substring("vantare-v2/frontend/".Length) })
          if ($paths.Count -gt 0) {
            & pnpm exec eslint -- @paths
            if ($LASTEXITCODE -ne 0) { throw "changed frontend lint failed" }
          }

      - name: Testing Center visual gate
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: |
          $scope = Get-Content "$env:RUNNER_TEMP/testing-center-changed-scope.json" -Raw | ConvertFrom-Json
          if ($scope.visual_required) {
            pnpm exec playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw "playwright chromium install failed" }
            pnpm visual:testing-center
            if ($LASTEXITCODE -ne 0) { throw "Testing Center visual gate failed" }
          }

      - name: Windows Wails build
        env:
          VANTARE_BUILD_CHANNEL: nightly
        run: wails3 task windows:build

      - name: Overlay Studio visual baselines (human-channel advisory)
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: |
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "playwright chromium install failed" }
          pnpm visual:overlay-studio

      - name: Global frontend lint debt (human-channel advisory)
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm lint
