name: Branch channel gates

on:
  push:
    branches: [nightly, testers]
  pull_request:
    branches: [nightly, testers, master]
  merge_group:
    branches: [nightly]
    types: [checks_requested]

permissions:
  contents: read
  issues: read

concurrency:
  group: branch-channel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VANTARE_DIR: "vantare-v2"

jobs:
  policy:
    name: Validate promotion path
    timeout-minutes: 15
    if: '!github.event.repository.private || github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","vantare-1565"]') || 'ubuntu-latest' }}
    outputs:
      # Lo lee `product` para saltarse el trabajo pesado sin dejar de reportar
      # su check requerido. Vacío o distinto de «false» ⇒ los gates corren.
      native: ${{ steps.native_scope.outputs.native }}
      installation: ${{ steps.installation_scope.outputs.installation }}
      overlays: ${{ steps.installation_scope.outputs.overlays }}
      # Lo lee `product` para elegir el gate de suite: `test` excluye el corpus
      # de telemetría y `completa` lo incluye. Vacío o distinto de «false» ⇒
      # corre el corpus (fail-closed).
      telemetria: ${{ steps.native_scope.outputs.telemetria }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      # Clasifica si la PR puede saltarse los gates nativos (docs, web retirada,
      # Supabase, tooling) y si hace falta el corpus de telemetría (runtime,
      # domain, ipc o testdata). El trabajo `product` sigue ejecutándose y
      # reportando su check requerido: filtrar en `on.pull_request.paths`
      # dejaría los checks requeridos en «Pending» y bloquearía la fusión (docs
      # de GitHub, «Workflow syntax» →
      # on.<push|pull_request>.<paths|paths-ignore>).
      # Fail-closed: sin evento de PR, sin base o si algo falla, las dos
      # decisiones valen `true`.
      - name: Clasificar si los gates nativos aplican
        id: native_scope
        shell: bash
        env:
          SCOPE_PATH: ${{ runner.temp }}/native-gate-scope.json
          DECISION_PATH: ${{ runner.temp }}/native-gate-scope.decision
        run: |
          set -euo pipefail
          fail_closed() {
            printf '{"native":true,"telemetria":true,"native_paths":[],"telemetria_paths":[],"reasons":["%s"]}\n' "$1" > "$SCOPE_PATH"
            {
              echo 'native=true'
              echo 'telemetria=true'
            } >> "$GITHUB_OUTPUT"
          }
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            fail_closed "non pull request event: native gates always run"
            exit 0
          fi
          if ! diff_base="$(git rev-parse "$GITHUB_SHA^1" 2>/dev/null)"; then
            fail_closed "no diff base: fail closed"
            exit 0
          fi
          if ! git diff --no-renames --name-only -z "$diff_base" "$GITHUB_SHA" > "$RUNNER_TEMP/native-scope-paths.bin"; then
            fail_closed "git diff failed: fail closed"
            exit 0
          fi
          if ! python .github/scripts/native_gate_scope.py --nul-file "$RUNNER_TEMP/native-scope-paths.bin" --output "$SCOPE_PATH" > "$DECISION_PATH"; then
            fail_closed "classifier failed: fail closed"
            exit 0
          fi
          # Dos líneas, en este orden: 1) native, 2) telemetria. Cualquier otro
          # valor (o una línea ausente) vuelve a `true`.
          native="$(sed -n 1p "$DECISION_PATH")"
          telemetria="$(sed -n 2p "$DECISION_PATH")"
          case "$native" in
            true|false) ;;
            *) native="true" ;;
          esac
          case "$telemetria" in
            true|false) ;;
            *) telemetria="true" ;;
          esac
          cat "$SCOPE_PATH"
          {
            echo "native=$native"
            echo "telemetria=$telemetria"
          } >> "$GITHUB_OUTPUT"

      - name: Classify installation coverage
        id: installation_scope
        shell: bash
        env:
          NATIVE_SCOPE: ${{ steps.native_scope.outputs.native }}
        run: |
          set -euo pipefail
          decision=true
          overlays=true
          if [ "$NATIVE_SCOPE" = false ]; then
            decision=false
            overlays=false
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_BASE_REF" = nightly ]; then
            base="$(git rev-parse HEAD^1)"
            decision="$(python vantare-v2/native/scripts/affected-crates.py --base "$base" --installation)"
            overlays="$(python vantare-v2/native/scripts/affected-crates.py --base "$base" --overlays)"
          fi
          case "$decision" in true|false) ;; *) exit 1 ;; esac
          case "$overlays" in true|false) ;; *) exit 1 ;; esac
          echo "installation=$decision" >> "$GITHUB_OUTPUT"
          echo "overlays=$overlays" >> "$GITHUB_OUTPUT"

      - name: Check branch topology
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BASE: ${{ github.base_ref }}
          EVENT_HEAD: ${{ github.head_ref }}
        run: |
          python .github/scripts/validate_branch_channels.py \
            --event "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --base "$EVENT_BASE" \
            --head "$EVENT_HEAD"

      - name: Test branch topology policy
        run: python .github/scripts/test_validate_branch_channels.py

      - name: Test public roadmap contracts offline
        run: |
          python -B -m unittest discover -s vantare-v2/scripts -p 'test*roadmap*.py'
          node --test vantare-v2/scripts/test_roadmap_web.mjs

      - name: Test Testing Center deterministic diff gate
        run: python .github/scripts/test_testing_center_diff_gate.py

      - name: Test native gate path scope
        run: |
          python .github/scripts/test_native_gate_scope.py
          python .github/scripts/test_native_ci_results.py
          python .github/scripts/test_native_target_cache_budget.py
          python -m unittest vantare-v2/native/scripts/test_affected_crates.py

      - name: Test Testing Center trusted manifest collector
        run: python .github/scripts/test_testing_center_manifest_collector.py
      - name: Test Testing Center changed lint scope
        run: python .github/scripts/test_testing_center_changed_lint.py

      - name: Test inert Testing Center merge queue policy
        run: python .github/scripts/test_testing_center_merge_queue.py

      - name: Test release notes rendering and its gate
        run: python .github/scripts/tests/test_release_notes.py

      - name: Test private runner hooks and artifact budget
        run: |
          python -m unittest discover -s tools/ci-runners -v
          python -m unittest discover -s .github/scripts -p test_artifact_budget.py -v

      - name: Test inert Testing Center Nightly closeout policies
        run: |
          python .github/scripts/test_testing_center_nightly_closeout.py -v
          python .github/scripts/test_testing_center_agent_callback.py -v

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: 2.7.13

      - name: Test Testing Center agent workflow contract
        run: deno test --no-lock --allow-read=.github/workflows,.github/agents,supabase/tests/testing-center-agent-workflow-contract.test.ts supabase/tests/testing-center-agent-workflow-contract.test.ts

      - name: Test Testing Center callback and deploy surface
        run: |
          deno test --no-lock --allow-read --allow-env \
            supabase/functions/testing-center-agent-callback/index.test.ts \
            supabase/functions/_shared/testing-center-agent-observability.test.ts \
            supabase/functions/scripts/verify-deploy-surface.test.ts

      - name: Test B01 ES256 bridge and report verification
        run: |
          deno test --config supabase/functions/deno.json --allow-env --allow-read \
            supabase/functions/native-account-authorize supabase/functions/testing-report-submit

      - name: Test marketing CI capability contract
        run: |
          python .github/scripts/test_marketing_postgres_ci.py
          python -m unittest discover -s supabase/tests -p test_run_admin_local.py

      - name: Test marketing handlers offline
        working-directory: supabase/functions
        run: |
          deno test --frozen --node-modules-dir=auto --allow-env \
            native-admin/ native-mail-consent/ _shared/mail-erasure.test.ts

  marketing-postgres:
    name: Validate marketing PostgreSQL and E2E
    # #1565 reserves Docker for hosted runners. Private hosted usage is explicit opt-in.
    if: >-
      (!github.event.repository.private || vars.MARKETING_POSTGRES_CI == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !github.event.repository.private)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: 2.7.13
      - name: Check Docker capability
        id: docker
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            printf '%s\n' 'available=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'available=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' '::warning::Marketing SQL/E2E omitted: Docker daemon unavailable; run before production activation.'
            printf '%s\n' 'Marketing SQL/E2E omitted: Docker unavailable. This is not a passing database test.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare marketing PostgreSQL image
        if: steps.docker.outputs.available == 'true'
        shell: bash
        timeout-minutes: 11
        run: |
          set -euo pipefail
          # Both official registries publish this 17.6.1.165 multiarch digest.
          digest=sha256:28f0e16a019e648089fc1a6d333549a55548f6019c15ae4bd7cd58b989027518
          image=public.ecr.aws/supabase/postgres:17.6.1.165
          for delay in 0 15 45; do
            if [ "$delay" -gt 0 ]; then
              printf 'Retrying PostgreSQL image download in %s seconds\n' "$delay"
              sleep "$delay"
            fi
            for registry in public.ecr.aws/supabase/postgres docker.io/supabase/postgres; do
              source="$registry@$digest"
              if timeout --kill-after=10s 80s docker pull "$source"; then
                # The disposable SQL runner consumes this existing local tag.
                docker tag "$source" "$image"
                printf 'PostgreSQL 17.6.1.165 ready from %s\n' "$source"
                exit 0
              fi
              printf '::warning::PostgreSQL image unavailable from %s; trying the next official source.\n' "$source"
            done
          done
          printf '%s\n' '::error::Both official PostgreSQL registries failed after three bounded rounds.'
          exit 1

      - name: Test marketing SQL and end-to-end consent locally
        if: steps.docker.outputs.available == 'true'
        run: |
          until mkdir "$HOME/.vantare-marketing-docker.lock" 2>/dev/null; do sleep 5; done
          trap 'rmdir "$HOME/.vantare-marketing-docker.lock"' EXIT
          python3 supabase/tests/run-admin-local.py \
            --output "$RUNNER_TEMP/marketing-sql" \
            --test marketing_mail.test.sql \
            --test marketing_mail_erasure.test.sql \
            --test marketing_mail_erasure_retention.test.sql \
            --test marketing_mail_waitlist_erasure.test.sql \
            --test marketing_mail_consent.test.sql \
            --test marketing_mail_hardening.test.sql \
            --test native_admin_deletion_r4.test.sql \
            --mail-e2e

      - name: Preserve marketing E2E failure diagnostics
        if: failure() && steps.docker.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-e2e-failure
          path: ${{ runner.temp }}/marketing-sql/marketing-mail-e2e.log
          if-no-files-found: ignore
          retention-days: 3

  native_build:
    name: Build native validation archive
    timeout-minutes: 45
    if: needs.policy.outputs.native != 'false'
    needs: policy
    runs-on: windows-latest
    env:
      VANTARE_CI_TARGET: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/native-build-setup
      - name: Restore bounded compiler target from PR or nightly
        id: compiler_target
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/vantare-targets/ci/debug
            ${{ runner.temp }}/vantare-targets/ci/.rustc_info.json
            ${{ runner.temp }}/vantare-targets/ci/.vantare-workspace
            ${{ runner.temp }}/vantare-targets/ci/CACHEDIR.TAG
          key: native-target-windows-1.95-${{ hashFiles('vantare-v2/native/Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-target-windows-1.95-${{ hashFiles('vantare-v2/native/Cargo.lock') }}-
      - name: Test Windows worker tooling
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'native-tooling'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          foreach ($test in @('slot-target-tests', 'slot-workspace-tests', 'slot-reuse-tests', 'caller-target-tests', 'config-queue-tests')) {
            pwsh -NoProfile -File "native/scripts/$test.ps1" -EvidenceDirectory $evidence
            if ($LASTEXITCODE) { throw "Worker tooling: $test failed" }
          }
      - name: Classify changed automatic scope
        if: needs.policy.outputs.native != 'false'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          AUTOMATIC_TC_SCOPE: ${{ startsWith(github.head_ref, 'vantareapp/tc-') }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_SCOPE_PATH: ${{ runner.temp }}/testing-center-changed-scope.json
        run: |
          set -euo pipefail
          if [ "$AUTOMATIC_TC_SCOPE" != "true" ]; then
            printf '%s\n' '{"eligible":true,"lint_paths":[],"reasons":[],"visual_required":false}' > "$CHANGED_SCOPE_PATH"
            exit 0
          fi
          test "$EVENT_NAME" = "pull_request"
          DIFF_BASE_SHA="$(git rev-parse "$GITHUB_SHA^1")"
          git diff --name-only --diff-filter=ACMR -z "$DIFF_BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths.bin"
          python .github/scripts/testing_center_changed_lint.py \
            --nul-file "$RUNNER_TEMP/changed-paths.bin" \
            --output "$CHANGED_SCOPE_PATH" \
            --enforce-testing-center-scope

      - name: Reject retired automatic UI scope
        if: needs.policy.outputs.native != 'false'
        run: |
          $scope = Get-Content "$env:RUNNER_TEMP/testing-center-changed-scope.json" -Raw | ConvertFrom-Json
          if (-not $scope.eligible -or $scope.lint_paths.Count -gt 0 -or $scope.visual_required) {
            throw "automatic frontend scope retired; no native preauthorization is granted"
          }

      - name: Verify explicit Supabase deploy surface
        if: needs.policy.outputs.native != 'false'
        run: ../supabase/functions/scripts/verify-deploy-surface.ps1

      - name: Test Windows runner hooks and static CRT
        if: needs.policy.outputs.native != 'false'
        run: |
          python -m unittest discover -s ../tools/ci-runners -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File native/packaging/build-crt-tests.ps1 -EvidenceDirectory "$env:RUNNER_TEMP/build-crt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # El binario solo cambia al subir la versión: se guarda en caché y se
      # evita recompilarlo (342–430 s por trabajo aquí; 174–226 s en Linux).
      - name: Native format and blocking gates
        if: needs.policy.outputs.native != 'false'
        working-directory: ${{ env.VANTARE_DIR }}/native
        shell: pwsh
        env:
          # Compilación con los 4 vCPU del runner hosted (16 GB); gates.ps1 lo
          # aplica a -j y a --build-jobs (#1654 ronda 2).
          CARGO_BUILD_JOBS: '4'
          # Cuatro hilos de test (el runner tiene 4 vCPU). Los 7 tests con
          # plazos de reloj duros de 1-3 s (ipc, launcher y runtime) llevan
          # threads-required en .config/nextest.toml: corren solos y primero, así
          # que no dependen de la CPU que quede. Si aparecen intermitentes,
          # volver a 2 y anotarlo en el cuaderno de #1654.
          NEXTEST_TEST_THREADS: '4'
          # Decisión del clasificador de rutas (trabajo `policy`). Vacío o
          # distinto de «false» ⇒ corre el corpus: fail-closed.
          TELEMETRIA_SCOPE: ${{ needs.policy.outputs.telemetria }}
        run: |
          $base = @()
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:GITHUB_BASE_REF -eq 'nightly') {
            $sha = & git rev-parse 'HEAD^1'
            if ($LASTEXITCODE) { throw 'Missing pull request diff base' }
            $base = @('-DiffBase', $sha)
          }
          $telemetry = @()
          if ($env:TELEMETRIA_SCOPE -ne 'false') { $telemetry = @('-Telemetry') }
          pwsh -NoProfile -File scripts/compilar.ps1 pwsh -NoProfile -File scripts/ci-gates.ps1 @base @telemetry
          if ($LASTEXITCODE) { throw 'Native blocking gates failed' }

      - name: Verify retained fixtures and references
        run: python native/retirement/verify.py
      - name: Share one compiled test archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-tests-${{ github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/vantare-targets/ci/nextest-tests.tar.zst
            ${{ runner.temp }}/vantare-targets/ci/ci-scope.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Bound compiler target cache size
        id: target_budget
        working-directory: ${{ github.workspace }}
        run: python .github/scripts/native_target_cache_budget.py "${{ runner.temp }}/vantare-targets/ci"
      - name: Save bounded compiler target
        if: steps.target_budget.outputs.save == 'true' && steps.compiler_target.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/vantare-targets/ci/debug
            ${{ runner.temp }}/vantare-targets/ci/.rustc_info.json
            ${{ runner.temp }}/vantare-targets/ci/.vantare-workspace
            ${{ runner.temp }}/vantare-targets/ci/CACHEDIR.TAG
          key: native-target-windows-1.95-${{ hashFiles('vantare-v2/native/Cargo.lock') }}-${{ github.sha }}

  native_tests:
    name: Run native ${{ matrix.suite }}
    timeout-minutes: 20
    needs: [policy, native_build]
    if: needs.policy.outputs.native != 'false'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test, telemetria]
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      # Architecture tests call cargo tree --offline: reuse sources, never targets.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-windows-1.95-${{ hashFiles('vantare-v2/native/Cargo.lock') }}
          restore-keys: cargo-windows-1.95-
      - name: Install prebuilt Nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-tests-${{ github.sha }}
          path: ${{ runner.temp }}/vantare-test-archive
      - name: Run compiled tests without rebuilding
        run: pwsh -NoProfile -File native/scripts/ci-reuse-tests.ps1 -Suite '${{ matrix.suite }}'

  native_lifecycle_build:
    name: Build lifecycle overlays in parallel
    timeout-minutes: 30
    needs: policy
    if: needs.policy.outputs.native != 'false' && needs.policy.outputs.overlays != 'false'
    runs-on: windows-latest
    env:
      VANTARE_CI_TARGET: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/native-build-setup
      - name: Build normal and QA overlays without Hub or Admin
        run: |
          pwsh -NoProfile -File native/scripts/compilar.ps1 pwsh -NoProfile -File native/scripts/ci-build-overlays.ps1
          if ($LASTEXITCODE) { throw 'Lifecycle overlays build failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-overlays-${{ github.sha }}
          overwrite: true
          path: ${{ runner.temp }}/vantare-targets/ci/debug/lifecycle
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  native_lifecycle:
    name: Run native lifecycle
    timeout-minutes: 15
    needs: [policy, native_build, native_lifecycle_build]
    if: >-
      always() && needs.policy.outputs.native != 'false' &&
      needs.native_build.result == 'success' &&
      (needs.native_lifecycle_build.result == 'success' || needs.native_lifecycle_build.result == 'skipped')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install prebuilt Nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-tests-${{ github.sha }}
          path: ${{ runner.temp }}/vantare-test-archive
      - name: Read archived lifecycle scope
        id: scope
        run: |
          $scope = Get-Content (Join-Path $env:RUNNER_TEMP 'vantare-test-archive/ci-scope.json') -Raw | ConvertFrom-Json
          "overlays=$($scope.overlays.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.scope.outputs.overlays != 'false'
        with:
          name: native-overlays-${{ github.sha }}
          path: ${{ runner.temp }}/vantare-overlay-archive
      - name: Run original compiled lifecycle harnesses
        run: pwsh -NoProfile -File native/scripts/ci-reuse-tests.ps1 -Suite lifecycle

  native_distribution:
    name: Validate native QA distribution
    # Previous serial gate passed in 57m24s; allow cold build margin while phase timings settle.
    timeout-minutes: 90
    if: needs.policy.outputs.native != 'false' && needs.policy.outputs.installation != 'false'
    needs: policy
    runs-on: windows-latest
    env:
      VANTARE_CI_TARGET: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/native-build-setup
      - name: Regress configuration import inside the build queue
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'distribution-tooling'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          pwsh -NoProfile -File native/scripts/config-queue-tests.ps1 -EvidenceDirectory $evidence
          if ($LASTEXITCODE) { throw 'Configuration import lost its parent build lease' }
      - name: Verify build-candidate release package excludes QA feature and symbols
        if: needs.policy.outputs.native != 'false'
        working-directory: ${{ env.VANTARE_DIR }}
        run: |
          pwsh -NoProfile -File native/scripts/compilar.ps1 pwsh -NoProfile -File native/gates.ps1 -Gate distribution -TargetDirectory "${{ runner.temp }}/vantare-targets/qa-exclusion"
          if ($LASTEXITCODE) { throw 'QA distribution boundary failed' }
      - name: Preserve distribution timings and live compiler cache statistics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-timings-${{ github.sha }}
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/vantare-targets/qa-exclusion/distribution-*.json
            ${{ runner.temp }}/vantare-targets/qa-exclusion/cargo-timings/*.html

  native_installation:
    # Retain the existing check name; product also requires native_distribution.
    name: Validate native distribution and installation
    timeout-minutes: 45
    if: needs.policy.outputs.native != 'false' && needs.policy.outputs.installation != 'false'
    needs: policy
    runs-on: windows-latest
    env:
      VANTARE_CI_TARGET: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/native-build-setup
      - name: Characterize Windows installation operations
        if: needs.policy.outputs.native != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_BUILD_JOBS: '4'
        run: |
          pwsh -NoProfile -File native/scripts/compilar.ps1 pwsh -NoProfile -File native/scripts/ci-installation.ps1
          if ($LASTEXITCODE) { throw 'Installation characterization failed' }

      - name: Preserve installation matrix snapshots
        if: always() && needs.policy.outputs.native != 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-matrix-windows
          overwrite: true
          path: |
            ${{ runner.temp }}/installation-matrix/**/snapshot.json
            ${{ runner.temp }}/installation-matrix/**/stdout.log
            ${{ runner.temp }}/installation-matrix/**/stderr.log
            ${{ runner.temp }}/installation-matrix/results.json
          if-no-files-found: ignore


  product:
    name: Validate Vantare blocking gates
    timeout-minutes: 5
    needs: [policy, native_build, native_tests, native_lifecycle_build, native_lifecycle, native_distribution, native_installation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require every applicable native gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python .github/scripts/native_ci_results.py
