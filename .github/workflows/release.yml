name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_call:
    outputs:
      release_tag:
        value: ${{ jobs.release.outputs.release_tag }}
      release_source_sha:
        value: ${{ jobs.release.outputs.release_source_sha }}
      release_asset_count:
        value: ${{ jobs.release.outputs.release_asset_count }}
      checksums_verified:
        value: ${{ jobs.release.outputs.checksums_verified }}
    inputs:
      publish_channel:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_notes:
        required: true
        type: string
      source_sha:
        description: "Exact commit to build and publish"
        required: true
        type: string
    secrets:
      VITE_SUPABASE_URL:
        required: true
      VITE_SUPABASE_ANON_KEY:
        required: true
      VANTARE_LICENSE_PUBLIC_KEYS:
        required: true
      DISCORD_PROGRESS_WEBHOOK_URL:
        required: true
      DISCORD_BUILD_WEBHOOK_URL:
        required: true
      DISCORD_RELEASE_WEBHOOK_URL:
        required: true
      DISCORD_KNOWN_ISSUES_WEBHOOK_URL:
        required: true
  workflow_dispatch:
    inputs:
      publish_channel:
        description: "Build only, or publish a verified pre-release"
        required: true
        default: none
        type: choice
        options: [none, nightly, testers]
      release_tag:
        description: "Required for pre-release, e.g. v0.1.0.5-nightly.1"
        required: false
        type: string
      release_notes:
        description: "Short, customer-facing summary"
        required: false
        type: string
      source_sha:
        description: "Exact commit to build and publish"
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"
  WAILS_VERSION: "v3.0.0-alpha.98-tui"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.1.0"
  NSIS_VERSION: "3.12.0"
  VANTARE_DIR: "vantare-v2"
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  source:
    name: Validate release channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source ref
        env:
          PUBLISH_CHANNEL: ${{ inputs.publish_channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_call" ]; then
            echo "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::source_sha must be 40 lowercase hex"; exit 1; }
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              case "$GITHUB_REF" in
                refs/heads/nightly|refs/heads/testers) ;;
                *) echo "::error::Internal builds can only run from nightly or testers"; exit 1 ;;
              esac
            fi
            if [ "$PUBLISH_CHANNEL" != "none" ]; then
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                test "$GITHUB_REF" = "refs/heads/$PUBLISH_CHANNEL" || { echo "::error::Channel and branch must match"; exit 1; }
              fi
              case "$PUBLISH_CHANNEL" in nightly|testers) ;; *) echo "::error::Invalid internal channel"; exit 1 ;; esac
              test -n "$RELEASE_TAG" || { echo "::error::release_tag is required"; exit 1; }
              echo "$RELEASE_TAG" | grep -Eq "^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-${PUBLISH_CHANNEL}\.[0-9]+$" || {
                echo "::error::Invalid pre-release tag for $PUBLISH_CHANNEL"; exit 1;
              }
            fi
            source_branch="$GITHUB_REF_NAME"
            if [ "$PUBLISH_CHANNEL" != "none" ]; then source_branch="$PUBLISH_CHANNEL"; fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_call" ] && [ "$PUBLISH_CHANNEL" = "none" ]; then
              echo "::error::Reusable release calls must publish an explicit channel"
              exit 1
            fi
            git fetch origin "$source_branch" --no-tags
            if [ "$PUBLISH_CHANNEL" != "none" ]; then
              git merge-base --is-ancestor "$SOURCE_SHA" "origin/$PUBLISH_CHANNEL" || {
                echo "::error::source_sha is not contained in origin/$PUBLISH_CHANNEL"
                exit 1
              }
            else
              git merge-base --is-ancestor "$SOURCE_SHA" "origin/$source_branch" || {
                echo "::error::source_sha is not contained in origin/$source_branch"
                exit 1
              }
            fi
            exit 0
          fi

          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Public releases require a v* tag"; exit 1 ;;
          esac
          git fetch origin master --no-tags
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test -n "$tag_commit" || { echo "::error::Unable to resolve $GITHUB_REF_NAME"; exit 1; }
          git merge-base --is-ancestor "$tag_commit" origin/master || {
            echo "::error::$GITHUB_REF_NAME is not contained in origin/master"
            exit 1
          }

      - name: Verify release manifest and changelog fragments
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_channel != 'none'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # The release body is rendered from this manifest and its fragments,
          # so no manifest means no release notes: the tester downloads a build
          # nobody described. It also feeds the Discord card after the Windows
          # build, where a missing file used to surface as a red run ~10 minutes
          # in with the release already published. Fail here, before any build.
          python .github/scripts/release_notes.py --tag "$RELEASE_TAG" --check

      - name: Verify pre-release Discord destinations
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_channel != 'none'
        env:
          DISCORD_PROGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK_URL }}
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_KNOWN_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_KNOWN_ISSUES_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          secret_names = (
              "DISCORD_PROGRESS_WEBHOOK_URL",
              "DISCORD_BUILD_WEBHOOK_URL",
              "DISCORD_RELEASE_WEBHOOK_URL",
              "DISCORD_KNOWN_ISSUES_WEBHOOK_URL",
          )
          # Only the Nightly/Testers route is required: it is the one testers
          # actually receive. The changelog channel has no webhook configured,
          # and requiring it blocked every pre-release. It stays optional here
          # and in the resolve step, so creating that webhook later restores
          # the announcement without touching this workflow.
          required = {
              "Nightly/Testers": "1519752249977340168",
          }
          failed = False
          channels = {}
          for secret_name in secret_names:
              webhook = os.environ.get(secret_name, "")
              if not webhook:
                  print(f"::error::{secret_name} is not configured")
                  failed = True
                  continue
              request = urllib.request.Request(webhook, headers={"User-Agent": "Vantare-GitHub-Actions/1.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  actual = str(json.load(response).get("channel_id", "missing"))
              channels.setdefault(actual, []).append(secret_name)
              print(f"{secret_name}: channel {actual}")
          for label, expected in required.items():
              matches = channels.get(expected, [])
              if len(matches) != 1:
                  print(f"::error::{label} requires exactly one webhook for channel {expected}; found {matches}")
                  failed = True
          if failed:
              raise SystemExit(1)
          PY

  build:
    name: Build Windows release artifacts
    needs: source
    runs-on: windows-latest
    env:
      # Frontend (Vite consumes these at build time)
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Go binary (injected via ldflags at build time). These are the same
      # public values Vite uses; the Go binary needs them to validate OAuth
      # tokens against Supabase at runtime without requiring testers to set
      # environment variables. Runtime env vars still override these.
      VANTARE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VANTARE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Versioned Ed25519 public keys only (key-id:base64url-public-key). The
      # private signing key exists exclusively in the Supabase function env.
      VANTARE_LICENSE_PUBLIC_KEYS: ${{ secrets.VANTARE_LICENSE_PUBLIC_KEYS }}
      # Branch builds identify their actual channel inside the binary. Tagged
      # public builds are always master; the source job already proves the tag
      # belongs to master.
      VANTARE_BUILD_CHANNEL: ${{ (inputs.publish_channel == 'nightly' || inputs.publish_channel == 'testers') && inputs.publish_channel || (github.ref_type == 'branch' && github.ref_name || 'master') }}
    defaults:
      run:
        shell: powershell
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Supabase Env Vars
        run: |
          if (-not $env:VITE_SUPABASE_URL) { throw "Missing VITE_SUPABASE_URL" }
          if (-not $env:VITE_SUPABASE_ANON_KEY) { throw "Missing VITE_SUPABASE_ANON_KEY" }
          if (-not $env:VANTARE_LICENSE_PUBLIC_KEYS) { throw "Missing VANTARE_LICENSE_PUBLIC_KEYS" }

      - name: Gate - Supabase deploy surface
        run: '& "$env:GITHUB_WORKSPACE\supabase\functions\scripts\verify-deploy-surface.ps1"'

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: ${{ env.VANTARE_DIR }}/go.mod
          cache-dependency-path: ${{ env.VANTARE_DIR }}/go.sum

      - name: Add Go bin to PATH
        run: echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache Wails CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~\go\bin\wails3.exe
          key: ${{ runner.os }}-wails3-${{ env.WAILS_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NSIS
        run: choco install nsis --version=${{ env.NSIS_VERSION }} --no-progress --yes

      - name: Install MSYS2 UCRT64 toolchain
        shell: powershell
        run: |
          choco install msys2 --no-progress --yes
          $bash = 'C:\msys64\usr\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) { throw "MSYS2 bash not found at $bash" }
          & $bash -lc 'pacman -Sy --noconfirm mingw-w64-ucrt-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 UCRT64 GCC installation failed" }
          if (-not (Test-Path -LiteralPath 'C:\msys64\ucrt64\bin\gcc.exe')) {
            throw 'MSYS2 UCRT64 GCC not found after installation'
          }

      - name: Install Wails v3 CLI
        run: |
          if (-not (Get-Command wails3 -ErrorAction SilentlyContinue)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          } else {
            Write-Host "wails3 already present in PATH"
          }

      - name: Gate - Frontend deps
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm install --frozen-lockfile

      - name: Gate - Frontend build
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm build

      - name: Gate - Telemetry TypeScript contract
        working-directory: ${{ env.VANTARE_DIR }}
        run: |
          go run ./tools/telemetry-contract-gen -check
          git diff --exit-code -- frontend/src/generated/

      - name: Gate - Go tests
        env:
          INTERNAL_BUILD: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
        run: |
          # ISA-118 used to be carved out of internal builds and repeated as an
          # advisory step. Its cause is fixed, so every build runs the same suite.
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed" }

      - name: Gate - Frontend tests
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        env:
          INTERNAL_BUILD: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
        run: |
          # ISA-172, ISA-173 and ISA-174 used to be excluded here and repeated as
          # advisory steps. Their causes are fixed, so internal builds now run the
          # same suite as public ones.
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed" }

      - name: Gate - Frontend lint
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm lint

      - name: Sync embedded version with the release tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+\.\d+(-[A-Za-z0-9.]+)?$') {
            # Build-only dispatches run from a branch and publish nothing, so the
            # committed VERSION is good enough for them.
            Write-Host "::notice::Ref '$tag' is not a release tag; keeping the committed VERSION"
            exit 0
          }
          go run ./build/sync_version.go -from-tag $tag
          # Carries the pre-release suffix into -X main.version; without it the
          # binary would report the numeric version only and re-offer its own update.
          "VANTARE_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building as $tag"

      - name: Build release artifacts
        run: |
          wails3 task release:clean
          wails3 task release:artifacts
          wails3 task release:verify

      - name: Verify artifact set
        run: |
          $files = @(
            "bin/vantare.exe",
            "bin/vantare.exe.sha256",
            "bin/vantare-amd64-installer.exe",
            "bin/vantare-amd64-installer.exe.sha256",
            "bin/vantare-portable-amd64.zip",
            "bin/vantare-portable-amd64.zip.sha256"
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing artifact: $f" }
          }
          Write-Host "All 6 official artifacts present."

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifacts-${{ github.run_id }}
          path: |
            ${{ env.VANTARE_DIR }}/bin/vantare.exe
            ${{ env.VANTARE_DIR }}/bin/vantare.exe.sha256
            ${{ env.VANTARE_DIR }}/bin/vantare-amd64-installer.exe
            ${{ env.VANTARE_DIR }}/bin/vantare-amd64-installer.exe.sha256
            ${{ env.VANTARE_DIR }}/bin/vantare-portable-amd64.zip
            ${{ env.VANTARE_DIR }}/bin/vantare-portable-amd64.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.publish_channel != 'none')
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.verify_release.outputs.release_tag }}
      release_source_sha: ${{ steps.verify_release.outputs.release_source_sha }}
      release_asset_count: ${{ steps.verify_release.outputs.release_asset_count }}
      checksums_verified: ${{ steps.verify_release.outputs.checksums_verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify release contract
        id: contract
        shell: bash
        env:
          PUBLISH_CHANNEL: ${{ inputs.publish_channel }}
          INPUT_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_call" ]; then
            tag="$INPUT_TAG"
            prerelease=true
            git fetch origin "$PUBLISH_CHANNEL" --no-tags
            git merge-base --is-ancestor "$SOURCE_SHA" "origin/$PUBLISH_CHANNEL" || { echo "::error::source_sha is not contained in origin/$PUBLISH_CHANNEL"; exit 1; }
          else
            tag="$GITHUB_REF_NAME"
            prerelease=false
            git fetch origin master --no-tags
            tag_commit="$(git rev-list -n 1 "$tag")"
            test -n "$tag_commit" || { echo "::error::Unable to resolve $tag"; exit 1; }
            git merge-base --is-ancestor "$tag_commit" origin/master || { echo "::error::$tag is not contained in origin/master"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-artifacts-${{ github.run_id }}
          path: ${{ env.VANTARE_DIR }}/bin

      - name: Render release notes from the manifest
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.contract.outputs.tag }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          # The body used to be scraped from a "## <tag>" heading in
          # docs/changelog.md, and when it was missing the step only warned and
          # published "Release <tag>". No nightly ever had that heading, so
          # every pre-release shipped with a placeholder where its notes should
          # be. It is rendered from the manifest instead, which is mandatory,
          # written in plain Spanish and already reviewed.
          python .github/scripts/release_notes.py \
            --tag "$RELEASE_TAG" \
            --revision "$SOURCE_SHA" \
            --output changelog_body.md
          test -s changelog_body.md || { echo "::error::Rendered release notes are empty"; exit 1; }
          echo "Release notes for $RELEASE_TAG: $(wc -c < changelog_body.md) bytes"

      - name: Create or update and verify GitHub Release (idempotent)
        id: verify_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.contract.outputs.tag }}"
          PRERELEASE="${{ steps.contract.outputs.prerelease }}"
          BIN_DIR="${{ env.VANTARE_DIR }}/bin"
          ASSETS=(
            "$BIN_DIR/vantare.exe"
            "$BIN_DIR/vantare.exe.sha256"
            "$BIN_DIR/vantare-amd64-installer.exe"
            "$BIN_DIR/vantare-amd64-installer.exe.sha256"
            "$BIN_DIR/vantare-portable-amd64.zip"
            "$BIN_DIR/vantare-portable-amd64.zip.sha256"
          )
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing expected asset: $asset"
              exit 1
            fi
          done
          (
            cd "$BIN_DIR"
            sha256sum --check vantare.exe.sha256
            sha256sum --check vantare-amd64-installer.exe.sha256
            sha256sum --check vantare-portable-amd64.zip.sha256
          )

          echo "Checking if GitHub Release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA" || {
              echo "::error::Existing release tag does not target source_sha"
              exit 1
            }
            echo "Release $TAG already exists; refreshing notes and re-uploading the 6 official assets with --clobber."
            gh release edit "$TAG" \
              --title "Vantare $TAG" \
              --notes-file changelog_body.md \
              $([ "$PRERELEASE" = "true" ] && echo --prerelease || echo --latest)
            for asset in "${ASSETS[@]}"; do
              echo "Uploading (clobber) $asset"
              gh release upload "$TAG" "$asset" --clobber
            done
          else
            echo "Release $TAG does not exist; creating it with the 6 official assets."
            gh release create "$TAG" \
              --title "Vantare $TAG" \
              --notes-file changelog_body.md \
              --target "$SOURCE_SHA" \
              $([ "$PRERELEASE" = "true" ] && echo --prerelease || echo --latest) \
              "${ASSETS[@]}"
          fi

          expected_assets="vantare-amd64-installer.exe
          vantare-amd64-installer.exe.sha256
          vantare-portable-amd64.zip
          vantare-portable-amd64.zip.sha256
          vantare.exe
          vantare.exe.sha256"
          actual_assets="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join("\n")')"
          test "$actual_assets" = "$expected_assets" || {
            echo "::error::Release does not contain exactly the 6 official assets"
            exit 1
          }
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_asset_count=6" >> "$GITHUB_OUTPUT"
          echo "checksums_verified=true" >> "$GITHUB_OUTPUT"
          echo "Verified release $TAG: source_sha=$SOURCE_SHA assets=6 checksums=3"

      - name: Resolve verified announcement metadata
        if: steps.contract.outputs.prerelease == 'true'
        id: announce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.contract.outputs.tag }}
        run: |
          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          download_url="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/vantare-amd64-installer.exe"
          sha256="$(awk '{print $1}' '${{ env.VANTARE_DIR }}/bin/vantare-amd64-installer.exe.sha256')"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Build accessible Discord payloads and HTML
        if: steps.contract.outputs.prerelease == 'true'
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          manifest="vantare-v2/docs/releases/${{ steps.contract.outputs.tag }}.json"
          test -f "$manifest" || { echo "::error::Missing canonical release manifest: $manifest"; exit 1; }
          mapfile -t files < <(python - "$manifest" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for issue in manifest["issues"]:
              print(f"vantare-v2/docs/changelog/fragments/{issue}.json")
          PY
          )
          args=(); for file in "${files[@]}"; do args+=(--fragment "$file"); done
          python .github/scripts/discord_communications.py "${{ inputs.publish_channel }}" --dry-run --revision "$SOURCE_SHA" \
            --manifest "$manifest" \
            --html-output "$RUNNER_TEMP/vantare-channel.html" "${args[@]}" > "$RUNNER_TEMP/channel.json"
          python .github/scripts/discord_communications.py build --dry-run --channel "${{ inputs.publish_channel }}" \
            --version "${{ steps.contract.outputs.tag }}" --notes "$NOTES" \
            --download-url "${{ steps.announce.outputs.download_url }}" --sha256 "${{ steps.announce.outputs.sha256 }}" \
            --release-url "${{ steps.announce.outputs.release_url }}" \
            --known-issues-url "${{ github.server_url }}/${{ github.repository }}/blob/master/vantare-v2/docs/tester-known-issues.md" \
            --html-output "$RUNNER_TEMP/vantare-changelog.html" > "$RUNNER_TEMP/changelog.json"

      - name: Render Discord cards
        if: steps.contract.outputs.prerelease == 'true'
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1200,630 \
            --screenshot="$RUNNER_TEMP/vantare-${{ inputs.publish_channel }}.png" "file://$RUNNER_TEMP/vantare-channel.html"
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1200,630 \
            --screenshot="$RUNNER_TEMP/vantare-changelog.png" "file://$RUNNER_TEMP/vantare-changelog.html"
          test -s "$RUNNER_TEMP/vantare-${{ inputs.publish_channel }}.png"
          test -s "$RUNNER_TEMP/vantare-changelog.png"

      - name: Resolve pre-release Discord routes by channel ID
        if: steps.contract.outputs.prerelease == 'true'
        env:
          DISCORD_PROGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK_URL }}
          DISCORD_BUILD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_KNOWN_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_KNOWN_ISSUES_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          names = (
              "DISCORD_PROGRESS_WEBHOOK_URL", "DISCORD_BUILD_WEBHOOK_URL",
              "DISCORD_RELEASE_WEBHOOK_URL", "DISCORD_KNOWN_ISSUES_WEBHOOK_URL",
          )
          # The tester route must resolve; the changelog one is written only if
          # a webhook uniquely matches its channel, and its absence leaves the
          # variable unset for the publish step to skip.
          targets = {"VANTARE_TESTER_WEBHOOK": "1519752249977340168"}
          optional = {"VANTARE_CHANGELOG_WEBHOOK": "1519747444315914512"}
          by_channel = {}
          for name in names:
              value = os.environ.get(name, "")
              if not value:
                  continue
              request = urllib.request.Request(value, headers={"User-Agent": "Vantare-GitHub-Actions/1.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  channel = str(json.load(response).get("channel_id", ""))
              by_channel.setdefault(channel, []).append(value)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output_file:
              for output, channel in targets.items():
                  matches = by_channel.get(channel, [])
                  if len(matches) != 1:
                      raise SystemExit(f"Unable to resolve unique webhook for {channel}")
                  output_file.write(f"{output}={matches[0]}\n")
              for output, channel in optional.items():
                  matches = by_channel.get(channel, [])
                  if len(matches) == 1:
                      output_file.write(f"{output}={matches[0]}\n")
                  else:
                      print(f"::notice::No unique webhook for channel {channel}; skipping {output}")
          PY

      - name: Publish Nightly/Testers and changelog after verified release
        if: steps.contract.outputs.prerelease == 'true'
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          manifest="vantare-v2/docs/releases/${{ steps.contract.outputs.tag }}.json"
          mapfile -t files < <(python - "$manifest" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for issue in manifest["issues"]:
              print(f"vantare-v2/docs/changelog/fragments/{issue}.json")
          PY
          )
          args=(); for file in "${files[@]}"; do args+=(--fragment "$file"); done
          DISCORD_PROGRESS_WEBHOOK_URL="$VANTARE_TESTER_WEBHOOK" \
          python .github/scripts/discord_communications.py "${{ inputs.publish_channel }}" --revision "$SOURCE_SHA" \
            --manifest "$manifest" \
            --image "$RUNNER_TEMP/vantare-${{ inputs.publish_channel }}.png" "${args[@]}"
          # The changelog channel is optional. Posting it to whatever webhook
          # happened to be configured would put the card in the wrong channel,
          # so with no route resolved the card is simply not published.
          if [ -n "${VANTARE_CHANGELOG_WEBHOOK:-}" ]; then
            DISCORD_BUILD_WEBHOOK_URL="$VANTARE_CHANGELOG_WEBHOOK" \
            python .github/scripts/discord_communications.py build --channel "${{ inputs.publish_channel }}" \
              --version "${{ steps.contract.outputs.tag }}" --notes "$NOTES" \
              --download-url "${{ steps.announce.outputs.download_url }}" --sha256 "${{ steps.announce.outputs.sha256 }}" \
              --release-url "${{ steps.announce.outputs.release_url }}" \
              --known-issues-url "${{ github.server_url }}/${{ github.repository }}/blob/master/vantare-v2/docs/tester-known-issues.md" \
              --image "$RUNNER_TEMP/vantare-changelog.png"
          else
            echo "::notice::No changelog webhook resolved; skipping the changelog card"
          fi

      - name: Build stable release card
        if: steps.contract.outputs.prerelease != 'true'
        run: |
          python .github/scripts/discord_communications.py release --dry-run \
            --tag "${{ steps.contract.outputs.tag }}" --section-file changelog_body.md \
            --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.contract.outputs.tag }}" \
            --revision "$SOURCE_SHA" --html-output "$RUNNER_TEMP/vantare-release.html"
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1200,630 \
            --screenshot="$RUNNER_TEMP/vantare-release.png" "file://$RUNNER_TEMP/vantare-release.html"
          test -s "$RUNNER_TEMP/vantare-release.png"

      - name: Publish stable release after verified assets
        if: steps.contract.outputs.prerelease != 'true'
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ vars.DISCORD_RELEASE_CHANNEL_ID }}
        run: |
          python .github/scripts/discord_communications.py release \
            --tag "${{ steps.contract.outputs.tag }}" --section-file changelog_body.md \
            --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.contract.outputs.tag }}" \
            --revision "$SOURCE_SHA" --image "$RUNNER_TEMP/vantare-release.png"
