[package]
name = "vantare-hub-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Unique Cargo artifact while the frozen GPUI Hub still builds in this workspace.
# QA/package preparation installs this binary as bin/vantare-hub.exe.
[[bin]]
name = "vantare-hub-host"
path = "src/main.rs"

[features]
# Opt-in local driver; never enabled by distribution.
qa-e2e = ["vantare-installer/test-installer"]
bindings = ["dep:ts-rs"]

[dependencies]
vantare-ipc.workspace = true
vantare-services.workspace = true
vantare-launcher.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ts-rs = { version = "=12.0.1", optional = true }

[target.'cfg(windows)'.dependencies]
vantare-installer = { path = "../installer", default-features = false, features = ["write-engine"] }

windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects"] }

[dev-dependencies]
ts-rs = "=12.0.1"

[[example]]
name = "export-types"
required-features = ["bindings"]

[lints]
workspace = true
