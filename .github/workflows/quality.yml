name: vantare-quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vantare-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-check:
    name: quality-check (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check retired scope and retained evidence
        run: python3 tools/quality/vantare_quality.py check --ci --base "${{ github.event.pull_request.base.sha || github.sha }}"
      - name: Test integrity and ratchet
        run: python3 -m unittest discover -s tools/quality/tests

  native-linux:
    name: native-linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vantare-v2/native
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake pkg-config libasound2-dev \
            libfontconfig-dev libgit2-dev libglib2.0-dev libssl-dev libva-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libzstd-dev

      - name: Verify pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check all workspace targets
        run: cargo check --workspace --all-targets --locked -j 2

      - name: Clippy all workspace targets
        run: cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings

      - name: Install pinned Nextest
        run: cargo install cargo-nextest --locked --version 0.9.146

      - name: Test workspace
        env:
          NEXTEST_TEST_THREADS: '1'
        run: cargo nextest run --workspace --locked -j 2 --no-fail-fast

      - name: Test real telemetry corpus
        env:
          NEXTEST_TEST_THREADS: '1'
        run: cargo nextest run --workspace --locked -j 2 --profile telemetria

      - name: Test lifecycle targets
        run: cargo test --workspace --test lifecycle --locked -j 2
