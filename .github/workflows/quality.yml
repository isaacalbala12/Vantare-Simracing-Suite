# Vantare quality gate (FASE 2). NO activado como required check todavia.
# Dispara en pull_request (job rapido quality-check) y workflow_dispatch
# (job quality-audit solo manual). Los exit codes se conservan: prohibido
# || true y continue-on-error.
name: vantare-quality

# Sin filtro paths: si algun dia se activa como required check, un PR que no
# toque estas rutas nunca reportaria el check y quedaria bloqueado para siempre
# (comportamiento conocido de GitHub). concurrency con cancel-in-progress ya
# evita ejecuciones acumuladas.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantare-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_MIN: '3.10'

jobs:
  quality-check:
    name: quality-check (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # necesario para merge-base y diff de politica

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.0'
          cache: true

      - name: Add Go bin to PATH
        # doctor y los analizadores necesitan staticcheck/deadcode en PATH.
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '9.1.0'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_MIN }}

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.49.0

      - name: Install frontend devDeps
        # El lockfile esta en la RAIZ (workspace pnpm); --frozen-lockfile debe
        # ejecutarse desde la raiz, no desde vantare-v2/frontend.
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        # govet/staticcheck resuelven vantare-v2/frontend via //go:embed dist;
        # sin el build, go list falla con "cannot embed directory dist".
        working-directory: vantare-v2/frontend
        run: pnpm build

      - name: Bootstrap quality tools
        run: python3 tools/quality/vantare_quality.py bootstrap

      - name: Quality test suites (ratchet + negative)
        # F10: las suites de tests se ejecutan en CI con exit code real.
        # Sin || true, sin continue-on-error. Si los tests fallan, CI falla.
        run: |
          python3 -B tools/quality/tests/test_ratchet.py
          python3 -B tools/quality/tests/test_negative.py

      - name: Doctor
        run: python3 tools/quality/vantare_quality.py doctor

      - name: Quality check (ratchet, CI mode)
        # --ci exige --base; la base real del PR es github.event.pull_request.base.sha.
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE=$(git merge-base origin/${{ github.base_ref || 'nightly' }} HEAD)
          fi
          python3 tools/quality/vantare_quality.py check --ci --base "$BASE"

      - name: Upload last-run
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: quality-last-run
          path: |
            tools/quality/.last-run.json
            tools/quality/.last-report.md
            tools/quality/.last-report.json

  quality-audit:
    name: quality-audit (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.0'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '9.1.0'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_MIN }}

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.49.0

      - name: Install frontend devDeps
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        # Igual que en quality-check: los analizadores Go necesitan dist/.
        working-directory: vantare-v2/frontend
        run: pnpm build

      - name: Bootstrap quality tools
        run: python3 tools/quality/vantare_quality.py bootstrap

      - name: Quality test suites (ratchet + negative)
        run: |
          python3 -B tools/quality/tests/test_ratchet.py
          python3 -B tools/quality/tests/test_negative.py

      - name: Audit (full analysis; la escritura de baselines es efimera en el runner y no vuelve al repo)
        run: python3 tools/quality/vantare_quality.py audit

      - name: Report
        if: always()
        run: python3 tools/quality/vantare_quality.py report
