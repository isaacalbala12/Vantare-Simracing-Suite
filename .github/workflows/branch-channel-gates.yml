name: Branch channel gates

on:
  push:
    branches: [nightly, testers]
  pull_request:
    branches: [nightly, testers, master]

permissions:
  contents: read

concurrency:
  group: branch-channel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.1.0"
  VANTARE_DIR: "vantare-v2"

jobs:
  policy:
    name: Validate promotion path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch topology
        run: |
          python .github/scripts/validate_branch_channels.py \
            --event "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --base "${{ github.base_ref }}" \
            --head "${{ github.head_ref }}"

      - name: Test branch topology policy
        run: python .github/scripts/test_validate_branch_channels.py

      - name: Test Testing Center deterministic diff gate
        run: python .github/scripts/test_testing_center_diff_gate.py

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: 2.7.13

      - name: Test Testing Center agent workflow contract
        run: deno test --no-lock --allow-read=supabase/tests/testing-center-agent-workflow-contract.test.ts supabase/tests/testing-center-agent-workflow-contract.test.ts

  product:
    name: Validate Vantare blocking gates
    needs: policy
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: ${{ env.VANTARE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.VANTARE_DIR }}/go.mod
          cache-dependency-path: ${{ env.VANTARE_DIR }}/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm build

      # ISA-118, ISA-172, ISA-173 and ISA-174 used to be carved out of these two
      # runs and repeated as advisory steps, which painted the gate red on every
      # pass. Their causes are fixed, so they are back inside the blocking runs.
      - name: Go tests
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed" }

      - name: Frontend tests
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm exec vitest run

      # Advisory, no bloqueante: las baselines se capturan en Windows local y el
      # antialiasing de fuentes puede diferir en el runner. Promover a bloqueante
      # solo cuando varias ejecuciones seguidas pasen limpias en CI.
      - name: Overlay Studio visual baselines (advisory until CI rendering is proven)
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: |
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "playwright chromium install failed" }
          pnpm visual:overlay-studio

      - name: Frontend lint (advisory while inherited debt is isolated)
        continue-on-error: true
        working-directory: ${{ env.VANTARE_DIR }}/frontend
        run: pnpm lint
