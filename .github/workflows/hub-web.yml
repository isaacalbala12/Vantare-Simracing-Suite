name: Hub web
on:
  pull_request:
    branches: [nightly]
    paths: ['vantare-v2/hub-web/**', '.github/workflows/hub-web.yml']
  workflow_dispatch:
concurrency:
  group: hub-web-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vantare-v2/hub-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun x playwright-core install --with-deps chromium
      - run: bun run build
      - run: bun scripts/web-a11y.ts
      - run: bun scripts/settings-web.ts
  windows-smoke:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vantare-v2/hub-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run package
      - run: bun run build
        env:
          VANTARE_HUB_QA_BUILD: '1'
      - run: bun run package
        env:
          VANTARE_HUB_QA_BUILD: '1'
      - run: bun run smoke
