[package]
name = "vantare-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["network"]
network = ["dep:ureq", "dep:url"]

[[bin]]
name = "vantare-services"
path = "src/bin/vantare-services.rs"
required-features = ["network"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
vantare-ipc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
url = { version = "2", features = ["serde"], optional = true }
sha2 = "0.10"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
# Mismo image 0.25.10 ya fijado por GPUI; solo el codec JPEG existente.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Wdk_System_SystemServices"] }

[lints]
workspace = true
