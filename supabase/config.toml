# Supabase config for production billing plus the isolated Testing Center pilot.
# Deployment wrappers keep both surfaces separate.
# Linked project: ombjshwzqgeisazijduq

project_id = "ombjshwzqgeisazijduq"

[functions.billing-checkout]
# Handler authenticates through Clerk TPA/PostgREST; legacy gateway validates
# Supabase-issued JWTs, which are no longer accepted as account identity.
verify_jwt = false

[functions.billing-portal]
verify_jwt = false

[functions.billing-webhook]
verify_jwt = false

[functions.testing-center-feedback]
verify_jwt = false

[functions.license-credential]
verify_jwt = false

[functions.clerk-webhook]
verify_jwt = false

[functions.billing-reconcile]
verify_jwt = false

[auth.third_party.clerk]
enabled = true
domain = "env(CLERK_DOMAIN)"

[functions.testing-center-linear-worker]
verify_jwt = false

[functions.testing-center-linear-webhook]
verify_jwt = false
