[package]
name = "vantare-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
parity-capture = ["vantare-ui/parity-capture"]
installer-qa = [] # Diagnóstico de rutas sin abrir ventana ni acceder al registro.

[[bin]]
name = "root-launch-probe"
path = "tests/support/root_launch_probe.rs"
required-features = ["installer-qa"]

[[test]]
name = "installed_data_root"
required-features = ["installer-qa"]

[[example]]
name = "ui-quality"
required-features = ["parity-capture"]

[dependencies]
vantare-launcher.workspace = true
vantare-installer = { path = "../installer", default-features = false, features = ["write-engine"] }
# `network` explícito: hub usa `services::config::account_portal_origin`. Sin la
# feature, `cargo check/build -p vantare-hub` no compila y alternar con
# `--workspace` recompilaba services y sus dependientes (#1654 r3).
vantare-services = { workspace = true, features = ["network"] }
vantare-ui = { path = "../ui" }
vantare-domain.workspace = true
vantare-ipc.workspace = true
vantare-strategy = { path = "../strategy" }
# Misma versión publicada que ui; migración mecánica del Hub congelado.
gpui = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ya fijada por services/GPUI; miniaturas locales del contrato IPC.
base64 = "0.22"
# Ya resuelta por GPUI; calendario civil/ventanas UTC, sin parser manual.
chrono = "0.4"


[lints]
workspace = true

[build-dependencies]
vantare-build-support.workspace = true

[dev-dependencies]
# La dependencia ya existente activa también el guard de raíz QA en los tests del Hub.
vantare-services = { workspace = true, features = ["test-support"] }
# El arnés con eventos de foco/teclado usa TestPlatform, sin ventanas del SO.
gpui = { workspace = true, features = ["test-support"] }
vantare-ipc = { workspace = true, features = ["test-support"] }
