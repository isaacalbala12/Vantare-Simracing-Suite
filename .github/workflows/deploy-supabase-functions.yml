name: Deploy approved Supabase Functions

on:
  workflow_dispatch:
    inputs:
      surface:
        description: Approved deployment surface
        type: choice
        options:
          - commercial
          - native-license
        default: commercial

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Guard and deploy approved Functions
    runs-on: windows-latest
    environment: supabase-production
    steps:
      # Pinneado por SHA: en este job vive el token de la Management API de
      # Supabase, y una etiqueta mutable como @v4 permitiria ejecutar codigo
      # arbitrario con el si un tercero reescribe la etiqueta.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # El secreto se declara por step, no a nivel de job: asi el step de
      # checkout no lo recibe en su entorno.
      - name: Verify deployment credentials are configured
        shell: powershell
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw "Missing SUPABASE_ACCESS_TOKEN" }
          if (-not $env:SUPABASE_PROJECT_REF) { throw "Missing SUPABASE_PROJECT_REF" }

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.105.0

      - name: Guard and deploy approved Functions
        shell: powershell
        env:
          DEPLOY_SURFACE: ${{ inputs.surface }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          $wrapper = "$env:GITHUB_WORKSPACE\supabase\functions\scripts\deploy-approved-functions.ps1"
          if ($env:DEPLOY_SURFACE -eq "native-license") {
            & $wrapper -ProjectRef $env:SUPABASE_PROJECT_REF -Functions @("native-license")
          } elseif ($env:DEPLOY_SURFACE -eq "commercial") {
            & $wrapper -ProjectRef $env:SUPABASE_PROJECT_REF
          } else {
            throw "Unsupported deployment surface"
          }
