name: Deploy approved Supabase Billing stack

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected Supabase environment
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: Read-only preflight or approved apply
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      confirmation:
        description: For apply, type DEPLOY-BILLING-<project-ref>
        required: false
        type: string
      backup_confirmation:
        description: For apply, type BACKUP-VERIFIED-<project-ref> after review
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-billing-stack
  cancel-in-progress: false

jobs:
  deploy:
    name: Preflight or deploy Billing stack
    runs-on: windows-latest
    environment: supabase-${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deployment credentials are configured
        shell: powershell
        run: |
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw "Missing SUPABASE_ACCESS_TOKEN" }
          if (-not $env:SUPABASE_PROJECT_REF) { throw "Missing SUPABASE_PROJECT_REF" }
          if (-not $env:SUPABASE_DB_URL) { throw "Missing SUPABASE_DB_URL" }

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.105.0

      - name: Preflight or deploy approved Billing stack
        shell: powershell
        env:
          DEPLOY_MODE: ${{ inputs.mode }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
        run: |
          & "$env:GITHUB_WORKSPACE\supabase\functions\scripts\deploy-approved-billing-stack.ps1" `
            -ProjectRef $env:SUPABASE_PROJECT_REF `
            -Mode $env:DEPLOY_MODE `
            -Confirmation $env:DEPLOY_CONFIRMATION `
            -BackupConfirmation $env:BACKUP_CONFIRMATION
