[package]
name = "vantare-engineer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Workspace propio durante el trabajo paralelo: el orquestador añade este
# miembro al padre al integrar, sin dos workers editando su manifiesto/lock.
[workspace]
resolver = "3"

[dependencies]
vantare-domain = { path = "../domain" }
vantare-ipc = { path = "../ipc" }
# Solo flows (cursor, codec y hechos neutrales); no lee adaptadores ni Core.
vantare-runtime = { path = "../runtime" }
serde_json = "=1.0.151"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
